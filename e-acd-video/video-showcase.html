/* ---- Calculations copied from the source app (computeTotals / calcTeamPct) ---- */
function calcTeamPct(teamObj) {
  if (!teamObj || !teamObj.locality || teamObj.locality <= 0) return null;
  return Math.round((teamObj.visited / teamObj.locality) * 100);
}
function computeTotals(teams) {
  const totals = { locality: 0, visited: 0, locked: 0, pop: 0, symp: 0, ref: 0, sample: 0, breeding: 0, abate: 0, pamphlet: 0, activeTeams: 0 };
  for (let t = 1; t <= 6; t++) {
    const d = teams[t];
    for (const k of ['locality', 'visited', 'locked', 'pop', 'symp', 'ref', 'sample', 'breeding', 'abate', 'pamphlet']) totals[k] += Number(d[k]) || 0;
    if ((Number(d.locality) || 0) > 0 || (Number(d.visited) || 0) > 0) totals.activeTeams++;
  }
  totals.pct = totals.locality > 0 ? Math.round((totals.visited / totals.locality) * 100) : 0;
  totals.unvisited = Math.max(0, totals.locality - totals.visited - totals.locked); // doughnut "Belum Dilawati"
  return totals;
}
const TOTALS = computeTotals(TEAMS);
const TEAMS_BEFORE = Object.assign({}, TEAMS, { 1: TEAM1_BEFORE });
const TOTALS_BEFORE = computeTotals(TEAMS_BEFORE);

/* Fictional-data annotation; styled as a film overlay, not as app UI. */
function simBadge(extra) {
  return '<div class="sim-badge ' + (extra || '') + '"><span class="sim-dot"></span>DATA SIMULASI</div>';
}

/* ---------------------------------------------------------------- app header */
function appHeader(p, mobile) {
  const btnRow = mobile
    ? '<div class="flex items-center gap-1 shrink-0">' +
        '<span class="w-8 h-8 rounded-lg bg-emerald-600/90 border border-emerald-400/40 text-white flex items-center justify-center shadow-sm"' + R(p + 'btnSync') + '>' + ICON.sync + '</span>' +
        '<span class="w-8 h-8 rounded-lg bg-white/15 border border-white/25 text-white flex items-center justify-center">' + ICON.phone + '</span>' +
      '</div>'
    : '<div class="flex items-center gap-1.5 shrink-0">' +
        '<span class="text-xs font-semibold bg-emerald-600/90 text-white px-2.5 py-1.5 rounded-lg border border-emerald-400/40 flex items-center gap-1 shadow-sm"' + R(p + 'btnSync') + '>' + ICON.sync + '<span>Selaraskan Sheet</span></span>' +
        '<span class="text-xs font-semibold bg-white/15 text-white px-2.5 py-1.5 rounded-lg border border-white/25 flex items-center gap-1">' + ICON.phone + '<span>Tambah ke Skrin Utama</span></span>' +
        '<span class="text-xs font-semibold bg-rose-500/80 text-white px-2.5 py-1.5 rounded-lg border border-rose-400/30">Set 0</span>' +
      '</div>';
  return '' +
  '<header class="bg-gradient-to-r from-teal-900 via-teal-800 to-emerald-800 text-white shadow-md relative z-30">' +
    '<div class="' + (mobile ? 'px-3 py-2' : 'max-w-5xl mx-auto px-4 py-3') + ' flex items-center justify-between gap-2">' +
      '<div class="flex items-center ' + (mobile ? 'gap-2.5' : 'gap-3') + ' min-w-0">' +
        '<img src="' + JATA_SRC + '" alt="Jata Negara" class="w-10 h-10 object-contain bg-white/95 rounded-lg p-1 shrink-0 shadow-sm" />' +
        '<div class="min-w-0">' +
          '<div class="flex items-center whitespace-nowrap ' + (mobile ? 'gap-1.5' : 'gap-2') + '">' +
            '<span class="' + (mobile ? 'text-[10px]' : 'text-[11px]') + ' font-bold uppercase tracking-wider bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full">PKD Muallim</span>' +
            '<span class="' + (mobile ? 'text-[10px]' : 'text-[11px]') + ' font-semibold bg-teal-700/80 text-teal-100 px-2 py-0.5 rounded-full border border-teal-500/40 flex items-center gap-1">' +
              '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"' + R(p + 'syncDot') + '></span><span' + R(p + 'syncText') + '>Sistem Aktif</span></span>' +
          '</div>' +
          '<h1 class="' + (mobile ? 'text-[14.5px]' : 'text-lg') + ' font-extrabold tracking-tight truncate mt-0.5">Sistem e-ACD Kes Denggi</h1>' +
        '</div>' +
      '</div>' + btnRow +
    '</div>' +
    '<div class="bg-teal-950/60 border-t border-teal-700/50 ' + (mobile ? 'text-[11px]' : 'text-xs') + ' text-teal-100 relative">' +
      '<div class="' + (mobile ? 'px-3 py-1.5' : 'max-w-5xl mx-auto px-4 py-2') + ' flex flex-wrap items-center justify-between gap-2">' +
        '<div class="flex flex-wrap items-center ' + (mobile ? 'gap-x-3' : 'gap-x-4') + ' gap-y-0.5"' + R(p + 'locBar') + '>' +
          '<span class="font-semibold text-white flex items-center gap-1">' + ICON.pin + '<span>' + esc(META.locality) + '</span></span>' +
          '<span class="text-teal-200">' + esc(META.date) + ' • ' + esc(META.time) + '</span>' +
          '<span class="underline text-amber-300 font-medium flex items-center gap-1"' + R(p + 'meetPt') + '><span>' + esc(META.meetingPoint) + '</span>' + ICON.ext + '</span>' +
        '</div>' +
        (mobile ? simBadge('ph-sim') : '<div class="flex items-center gap-3"><span class="text-[11px] text-amber-300 underline font-medium">Tetapan Sheet</span><span class="text-[11px] text-teal-200 underline">Ubah Info Lokaliti</span></div>') +
      '</div>' +
    '</div>' +
  '</header>';
}

/* --------------------------------------------------------- dashboard pieces */
function heroCard(p) {
  return '' +
  '<div class="bg-gradient-to-br from-teal-800 to-emerald-900 text-white rounded-2xl p-5 shadow-md flex flex-col justify-between relative"' + R(p + 'hero') + '>' +
    '<div>' +
      '<div class="flex items-center justify-between gap-2">' +
        '<span class="text-xs font-bold uppercase tracking-wider text-teal-200">Pencapaian Liputan ACD</span>' +
        '<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-teal-700 text-teal-100 whitespace-nowrap"' + R(p + 'kpiBadge') + '>Sasaran ≥ 80%</span>' +
      '</div>' +
      '<div class="mt-3 flex items-baseline gap-3">' +
        '<span class="text-5xl font-extrabold tracking-tight tnum"' + R(p + 'kpiPct') + '>0%</span>' +
        '<span class="text-sm text-teal-200 font-medium tnum"' + R(p + 'kpiRatio') + '>(0 / 0 premis)</span>' +
      '</div>' +
      '<div class="relative mt-3">' +
        '<div class="w-full bg-teal-950/70 h-3 rounded-full overflow-hidden border border-teal-700/50">' +
          '<div class="bg-amber-400 h-full rounded-full" style="width:0%"' + R(p + 'kpiBar') + '></div>' +
        '</div>' +
        '<div class="target-mark" style="left:80%"' + R(p + 'targetMark') + '><span>Sasaran 80%</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="mt-4 pt-3 border-t border-teal-700/60 flex items-center justify-between text-xs text-teal-100 gap-2">' +
      '<span>Formula: <code class="text-amber-300 font-mono">ROUND(Dilawati / Lokaliti × 100)</code></span>' +
      '<span class="font-bold whitespace-nowrap tnum"' + R(p + 'kpiTeams') + '>0/6 Pasukan Aktif</span>' +
    '</div>' +
  '</div>';
}

function metricCards(p, cols) {
  const card = (cls, labelCls, label, ref, valCls, unit, unitCls, sub, subCls, extra) =>
    '<div class="bg-white rounded-2xl p-4 shadow-sm border ' + cls + '"' + R(p + ref + 'Card') + '>' +
      '<span class="text-xs font-semibold ' + labelCls + ' block">' + label + '</span>' +
      '<div class="mt-1 flex items-baseline justify-between">' +
        (extra ? extra : '<span class="text-2xl font-extrabold tnum ' + valCls + '"' + R(p + ref) + '>0</span><span class="text-xs font-medium ' + unitCls + '">' + unit + '</span>') +
      '</div>' +
      '<p class="text-[11px] mt-1 ' + subCls + '">' + sub + '</p>' +
    '</div>';
  return '<div class="grid ' + cols + ' gap-3">' +
    card('border-slate-200', 'text-slate-500', '1. Rumah Dalam Lokaliti', 'mLoc', 'text-slate-900', 'buah', 'text-slate-400', 'Sasaran keseluruhan operasi', 'text-slate-500') +
    card('border-emerald-200 bg-emerald-50/30', 'text-emerald-800', '2. Rumah Dilawati', 'mVis', 'text-emerald-700', 'buah', 'text-emerald-600', 'Berjaya diperiksa petugas', 'text-emerald-700') +
    card('border-amber-200 bg-amber-50/30', 'text-amber-900', '3. Berkunci / Kosong', 'mLock', 'text-amber-700', 'buah', 'text-amber-700', 'Termasuk enggan / lot kosong', 'text-amber-800') +
    card('border-blue-200 bg-blue-50/30', 'text-blue-900', '4. Penduduk Diperiksa', 'mPop', 'text-blue-700', 'orang', 'text-blue-600', 'Jumlah disaring gejala ACD', 'text-blue-800') +
    card('border-rose-200 bg-rose-50/40', 'text-rose-900', '5. Kes Bergejala Dikesan', 'mSymp', 'text-rose-600', 'orang', 'text-rose-600', 'Demam / tanda klinikal denggi', 'text-rose-800') +
    card('border-purple-200 bg-purple-50/30', 'text-purple-900', '6. Rujukan & Sampel', 'mRef', '', '', '', 'Dirujuk ke KK / Hospital', 'text-purple-800',
      '<div><span class="text-2xl font-extrabold text-purple-700 tnum"' + R(p + 'mRef') + '>0</span> <span class="text-xs text-purple-600 font-medium">rujukan</span></div>' +
      '<span class="text-xs font-bold bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full tnum"' + R(p + 'mSample') + '>0 sampel</span>') +
  '</div>';
}

function bahagianC(p, cols) {
  return '<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">' +
    '<div class="mb-3"><h3 class="text-sm font-bold text-slate-800">Ringkasan Pemeriksaan Persekitaran & Pendidikan Kesihatan (Bahagian C)</h3>' +

/* SVG bar chart that mimics the Chart.js bar chart of the source (3 datasets, 6 teams). */
function barChartSvg(p, W, H) {
  const padL = 34, padR = 8, padT = 10, legendH = 34, xLabH = 22;
  const plotW = W - padL - padR, plotH = H - padT - legendH - xLabH, maxY = 20;
  let g = '';
  for (let v = 0; v <= maxY; v += 5) {
    const y = padT + plotH - (v / maxY) * plotH;
    g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="#e2e8f0" stroke-width="1"/>' +
         '<text x="' + (padL - 7) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="11" fill="#64748b">' + v + '</text>';
  }
  const groupW = plotW / 6, catW = groupW * 0.8, barW = (catW / 3) * 0.9;
  const colors = ['#94a3b8', '#0d9488', '#f59e0b'];
  let bars = '';
  for (let t = 1; t <= 6; t++) {
    const gx = padL + groupW * (t - 1) + (groupW - catW) / 2;
    for (let k = 0; k < 3; k++) {
      const x = gx + (catW / 3) * k + ((catW / 3) - barW) / 2;
      bars += '<path fill="' + colors[k] + '" d=""' + R(p + 'bar' + t + '_' + k) + ' data-x="' + x.toFixed(2) + '" data-w="' + barW.toFixed(2) + '"/>';
    }
    g += '<text x="' + (padL + groupW * (t - 0.5)) + '" y="' + (padT + plotH + 16) + '" text-anchor="middle" font-size="11" fill="#64748b">Pasukan ' + t + '</text>';
  }
  const legend = [['Dalam Lokaliti', colors[0]], ['Dilawati', colors[1]], ['Berkunci / Kosong', colors[2]]];
  let lx = W / 2 - 150, ly = H - 12, lg = '';
  for (const [label, c] of legend) {
    lg += '<rect x="' + lx + '" y="' + (ly - 10) + '" width="12" height="12" fill="' + c + '"/><text x="' + (lx + 17) + '" y="' + ly + '" font-size="11" fill="#475569">' + label + '</text>';
    lx += 18 + label.length * 6.2 + 16;
  }
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' + R(p + 'barSvg') + ' data-plot="' + [padL, padT, plotW, plotH, maxY].join(',') + '">' + g + bars + lg + '</svg>';
}

/* SVG doughnut mimicking the Chart.js doughnut (cutout 64%, white 2px borders). */
function doughnutSvg(p, W, H) {
  const legendH = 34, cx = W / 2, cy = (H - legendH) / 2 + 2, r = Math.min(W, H - legendH) / 2 - 8;
  const items = [['Dilawati', '#0d9488'], ['Berkunci / Kosong', '#f59e0b'], ['Belum Dilawati', '#cbd5e1']];
  let lg = '', lx = 8, ly = H - 12;
  const widths = items.map(([l]) => 18 + l.length * 6.1 + 12);
  const total = widths.reduce((a, b) => a + b, 0);
  lx = (W - total) / 2;
  items.forEach(([label, c], i) => {
    lg += '<rect x="' + lx + '" y="' + (ly - 10) + '" width="12" height="12" fill="' + c + '"/><text x="' + (lx + 17) + '" y="' + ly + '" font-size="11" fill="#475569">' + label + '</text>';
    lx += widths[i];
  });
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' + R(p + 'donutSvg') + ' data-geo="' + [cx, cy, r, r * 0.64].join(',') + '">' +
    '<path fill="#0d9488" stroke="#fff" stroke-width="2" d=""' + R(p + 'arc0') + '/>' +
    '<path fill="#f59e0b" stroke="#fff" stroke-width="2" d=""' + R(p + 'arc1') + '/>' +
    '<path fill="#cbd5e1" stroke="#fff" stroke-width="2" d=""' + R(p + 'arc2') + '/>' + lg + '</svg>';
}

function sheetWindow() {

    'Jumlah Penduduk Diperiksa (ACD)', 'Jumlah Kes Bergejala Dikesan', 'Jumlah Rujukan Ke Fasiliti Kesihatan', 'Pencapaian ACD (%)'];
  const keys = ['locality', 'visited', 'locked', 'pop', 'symp', 'ref'];

  html += '<div class="sh-row"><div class="sh-rn">7</div><div class="sh-c sh-A"></div><div class="sh-c sh-B hdr">PERKARA</div>' +

  for (let r = 0; r < 7; r++) {
    const rowNum = 8 + r;

    for (let t = 1; t <= 6; t++) {
      const v = r < 6 ? TEAMS[t][keys[r]] : calcTeamPct(TEAMS[t]) + '%';
      cells += '<div class="sh-c num' + (r < 6 ? ' data' : ' pct') + '"' + R('sh.c' + r + '_' + t) + '><span>' + v + '</span></div>';
    }

    html += '<div class="sh-row' + (r === 6 ? ' pctrow' : '') + '"><div class="sh-rn">' + rowNum + '</div><div class="sh-c sh-A"></div><div class="sh-c sh-B">' + labels[r] + '</div>' + cells +
      '<div class="sh-c num tot"' + R('sh.tot' + r) + '><span>' + tot + '</span></div></div>';
  }
  return '<div class="actor sheet"' + R('sheet') + '>' +
    '<div class="sh-title"><span class="sh-ico">' + ICON.grid + '</span><div><div class="sh-name">ACD Denggi Kg. Ketoyong</div><div class="sh-sub">Google Sheets · paparan simulasi</div></div>' + simBadge('sh-sim') + '</div>' +

  '</div>';
}

/* ---- engine.js ---- */
/* ==========================================================================
 * engine.js — deterministic timeline. renderFrame(frameIndex) is a pure
 * function of the frame number (t = frameIndex / 60): it recomputes every
 * animated property from t, so seeking to a frame and playing up to it give
 * the same pixels. No CSS transitions, no CSS animations, no Math.random().
 * ========================================================================== */
'use strict';

/* ---------------------------------------------------------------- math */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
function makeOutBack(s) { return p => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); }
/* Analytic damped spring, normalised so f(0)=0 and f(1)=1 (subtle overshoot). */
function makeSpring(zeta, w) {
  const wd = w * Math.sqrt(1 - zeta * zeta);
  const f = p => 1 - Math.exp(-zeta * w * p) * (Math.cos(wd * p) + (zeta * w / wd) * Math.sin(wd * p));
  const end = f(1);
  return p => (p <= 0 ? 0 : p >= 1 ? 1 : f(p) / end);
}
const E = {
  lin: p => p,
  outQuad: p => 1 - (1 - p) * (1 - p),
  inQuad: p => p * p,
  inCubic: p => p * p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2), // as Motion Canvas easeInOutCubic
  outQuart: p => 1 - Math.pow(1 - p, 4),
  inOutQuart: p => (p < 0.5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: makeOutBack(1.25),
  spring: makeSpring(0.62, 11),
  springSoft: makeSpring(0.78, 10)
};
/* progress of t through [t0, t1] with easing; 0 before, 1 after */
function seg(t, t0, t1, e) { if (t <= t0) return 0; if (t >= t1) return 1; return (e || E.inOutCubic)((t - t0) / (t1 - t0)); }
/* in a→b, hold, out c→d */
function win(t, a, b, c, d, ein, eout) { return Math.min(seg(t, a, b, ein || E.outCubic), 1 - seg(t, c, d, eout || E.inCubic)); }
function mix(a, b, p) {
  if (typeof a === 'number') return lerp(a, b, p);
  const o = {}; for (const k in a) o[k] = lerp(a[k], b[k] === undefined ? a[k] : b[k], p); return o;
}
/* keyframes: [[time, value, easingIntoThisKey?], ...] */
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t < keys[i][0]) {
      const k0 = keys[i - 1], k1 = keys[i];
      return mix(k0[1], k1[1], (k1[2] || E.inOutCubic)((t - k0[0]) / (k1[0] - k0[0])));
    }
  }
  return keys[keys.length - 1][1];
}
/* step keyframes (constant interpolation): [[time, value], ...] */
function step(t, keys) { let v = keys[0][1]; for (const [k, val] of keys) { if (t >= k) v = val; } return v; }

/* ---------------------------------------------------------------- seeded randomness */
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* smooth deterministic noise in [-1, 1] */
function noise(t, seed) {
  const r = rng(seed * 7919 + 13);
  let v = 0; for (let i = 0; i < 3; i++) { const f = 3 + r() * 9, ph = r() * 6.283; v += Math.sin(t * f + ph) / (i + 1); }
  return v / 1.83;
}

/* ---------------------------------------------------------------- DOM helpers (cached writes) */
const $ = {};
function collectRefs(root) { root.querySelectorAll('[data-ref]').forEach(el => { $[el.dataset.ref] = el; }); }
function css(el, prop, val) { const c = el.__s || (el.__s = {}); if (c[prop] !== val) { el.style.setProperty(prop, val); c[prop] = val; } }
function tf(el, v) { css(el, 'transform', v); }
function op(el, v) { css(el, 'opacity', (Math.round(clamp(v) * 1000) / 1000).toString()); }
function vis(el, on) { css(el, 'display', on ? '' : 'none'); }
function txt(el, s) { if (el.__t !== s) { el.textContent = s; el.__t = s; } }
function html(el, s) { if (el.__h !== s) { el.innerHTML = s; el.__h = s; } }
function cls(el, c, on) { const k = '__c' + c; if (el[k] !== on) { el.classList.toggle(c, !!on); el[k] = on; } }
function attr(el, a, v) { const k = '__a' + a; if (el[k] !== v) { el.setAttribute(a, v); el[k] = v; } }

/* ---------------------------------------------------------------- dashboard data over time */
function zeroTeams() { const o = {}; for (let t = 1; t <= 6; t++) o[t] = { locality: 0, visited: 0, locked: 0, pop: 0, symp: 0, ref: 0, sample: 0, breeding: 0, abate: 0, pamphlet: 0 }; return o; }
/* Team values shown by the dashboards at time t (Scene 4 count-up uses the same dataset). */
function teamsAt(t) {
  if (t < T.s4.tapDash) return zeroTeams();
  const pL = seg(t, T.s4.loc[0], T.s4.loc[1], E.outCubic);
  const pV = seg(t, T.s4.vis[0], T.s4.vis[1], E.inOutSine);
  const pR = seg(t, T.s4.rest[0], T.s4.rest[1], E.outCubic);
  const o = {};
  for (let k = 1; k <= 6; k++) {
    const d = TEAMS[k];
    o[k] = {
      locality: Math.round(d.locality * pL), visited: Math.round(d.visited * pV), locked: Math.round(d.locked * pR),
      pop: Math.round(d.pop * pR), symp: Math.round(d.symp * pR), ref: Math.round(d.ref * pR), sample: Math.round(d.sample * pR),
      breeding: Math.round(d.breeding * pR), abate: Math.round(d.abate * pR), pamphlet: Math.round(d.pamphlet * pR)
    };
  }
  return o;

function renderSubs(t) {

    if (w > a) { a = w; best = c; }
  }
  // bridge short gaps so the box does not flicker between phrases
  const box = $['subsBox'];
  if (!best) {
    let prev = null, next = null;
    for (const c of CUES) { if (c.end <= t) prev = c; if (!next && c.start > t) next = c; }
    if (prev && next && next.start - prev.end < 0.65 && t - prev.end < 0.65) { best = prev; a = 0; }
  }
  const showSubs = window.ACD_SUBS !== false;
  op(box, showSubs ? a : 0);

function dkScroll(t) {

function barPath(x, y, w, h, r) {
  if (h <= 0.01) return '';
  r = Math.min(r, w / 2, h);
  return 'M' + x.toFixed(2) + ' ' + (y + h).toFixed(2) + 'V' + (y + r).toFixed(2) + 'Q' + x.toFixed(2) + ' ' + y.toFixed(2) + ' ' + (x + r).toFixed(2) + ' ' + y.toFixed(2) +
    'H' + (x + w - r).toFixed(2) + 'Q' + (x + w).toFixed(2) + ' ' + y.toFixed(2) + ' ' + (x + w).toFixed(2) + ' ' + (y + r).toFixed(2) + 'V' + (y + h).toFixed(2) + 'Z';
}
function arcPath(cx, cy, R, r, a0, a1) {
  if (a1 - a0 < 0.0005) return '';
  if (a1 - a0 >= Math.PI * 2 - 1e-4) a1 = a0 + Math.PI * 2 - 1e-4;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const p = (rad, a) => (cx + Math.cos(a) * rad).toFixed(2) + ' ' + (cy + Math.sin(a) * rad).toFixed(2);
  return 'M' + p(R, a0) + 'A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(R, a1) + 'L' + p(r, a1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(r, a0) + 'Z';
}

    [30.0, 35.0, C.D69], [35.0, 40.0, C.Bm11], [40.0, 45.0, C.G9], [45.0, 50.0, C.A],
    [50.0, 54.6, C.G9], [54.6, 58.0, C.A], [58.0, 61.5, C.Bm11], [61.5, 66.0, C.D69], [66.0, 70.0, C.G9],

        }
        case 'blip': glide(t, ev.f || 1800, (ev.f || 1800) * 1.15, 0.05, 0.08 * soft, ((idx % 2) ? 0.3 : -0.3), 0.15); break;
        case 'paste': glide(t, 300, 180, 0.12, 0.18, 0, 0.1); glide(t + 0.04, 900, 1400, 0.08, 0.1, 0.2, 0.2); break;
        case 'sting': glide(t, 74, 37, 2.4, 0.45, 0, 0.35); [62, 69, 74, 78, 81].forEach((m, i) => bell(t + i * 0.035, m, 0.075, 3.8, -0.4 + i * 0.2, 0.75)); break;
      }
    });
    // rain bed (field conditions, Scene 1)
    {
      const bp = biquadBP(), [t0, t1] = [5.2, 10.0], i0 = Math.round(t0 * SR), len = Math.round((t1 - t0) * SR);
      for (let k = 0; k < len; k++) { const q = k / len, a = Math.sin(Math.PI * q) * 0.11; const v = bp(nz() * 2 - 1, 2400, 0.5) * a; add(i0 + k, v * (0.8 + 0.2 * Math.sin(k / 4000)), v * (0.8 + 0.2 * Math.cos(k / 4100)), 0.15); }
    }
    onProgress && onProgress(0.7);

    /* ---- 6. reverb (Freeverb-style, 24 kHz) on the send bus */
    {
      const RSR = 24000, RN = Math.ceil(N / 2), inp = new Float32Array(RN);
      for (let i = 0; i < RN; i++) inp[i] = (SEND[2 * i] + (SEND[2 * i + 1] || 0)) * 0.5;
      const combT = [1116, 1188, 1277, 1356, 1422, 1491, 1557, 1617].map(v => Math.round(v * RSR / 44100));
      const apT = [556, 441, 341, 225].map(v => Math.round(v * RSR / 44100));
      const outL = new Float32Array(RN), outR = new Float32Array(RN);
      for (const [out, spread] of [[outL, 0], [outR, 12]]) {
        const combs = combT.map(d => ({ b: new Float32Array(d + spread), i: 0, z: 0 }));
        const aps = apT.map(d => ({ b: new Float32Array(d + spread), i: 0 }));
        const fb = 0.86, damp = 0.32;
        for (let n = 0; n < RN; n++) {
          const x = inp[n] * 0.015; let y = 0;
          for (const c of combs) { const o = c.b[c.i]; c.z = o * (1 - damp) + c.z * damp; c.b[c.i] = x + c.z * fb; c.i = (c.i + 1) % c.b.length; y += o; }
          for (const a of aps) { const o = a.b[a.i]; const v = -y + o; a.b[a.i] = y + o * 0.5; a.i = (a.i + 1) % a.b.length; y = v; }
          out[n] = y;
        }
      }
      for (let i = 0; i < N; i++) { const x = i / 2, j = x | 0, f = x - j, j1 = Math.min(RN - 1, j + 1); L[i] += (outL[j] + (outL[j1] - outL[j]) * f) * 3.2; R[i] += (outR[j] + (outR[j1] - outR[j]) * f) * 3.2; }
    }
    onProgress && onProgress(0.9);

    /* ---- 7. master: RMS-normalise, soft-limit, fades */
    let acc = 0; for (let i = 0; i < N; i += 4) acc += L[i] * L[i] + R[i] * R[i];
    const rms = Math.sqrt(acc / (N / 2));
    const g = 0.105 / (rms || 1);          // ≈ -19.6 dBFS RMS before limiting
    const knee = 0.56, room = 0.28;     // ceiling ≈ 0.84 (−1.5 dBFS) to leave AAC headroom
    for (let i = 0; i < N; i++) {
      const t = i / SR, fade = Math.min(1, t / 0.05) * Math.min(1, Math.max(0, (DURATION - t) / 0.7));
      for (const buf of [L, R]) {
        let x = buf[i] * g, ax = Math.abs(x);
        if (ax > knee) x = Math.sign(x) * (knee + room * Math.tanh((ax - knee) / room));
        buf[i] = x * fade;
      }
    }
    onProgress && onProgress(1);
    return { L, R, sampleRate: SR, length: N };
  }

  /* async wrapper so the page stays responsive while the mix is computed */
  let cache = null;
  async function render(onProgress) {
    if (cache) return cache;
    await new Promise(r => setTimeout(r, 0));
    cache = synth(buildSoundEvents(), onProgress);
    return cache;
  }
  /* interleaved 16-bit PCM, base64-encoded in chunks (used by render-video.js) */
  async function pcm16Chunks(chunkFrames) {
    const mix = await render();
    chunkFrames = chunkFrames || 480000;
    const out = [];
    for (let s = 0; s < mix.length; s += chunkFrames) {
      const n = Math.min(chunkFrames, mix.length - s), buf = new Int16Array(n * 2);
      for (let i = 0; i < n; i++) {
        buf[2 * i] = Math.max(-32768, Math.min(32767, Math.round(mix.L[s + i] * 32767)));
        buf[2 * i + 1] = Math.max(-32768, Math.min(32767, Math.round(mix.R[s + i] * 32767)));
      }
      const bytes = new Uint8Array(buf.buffer); let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      out.push(btoa(bin));
    }
    return out;
  }
  return { SR, N, render, pcm16Chunks, CHORDS };
})();

/* ---- player.js ---- */
/* ==========================================================================
 * player.js — preview player. Playback is quantised to frames: the frame
 * shown while playing is exactly renderFrame(floor(t * 60)), the same call a
 * seek or the MP4 exporter makes. Audio is the precomputed mix from
 * audio.js, started at offset t, so seek/restart always re-sync sound cues.
 * ========================================================================== */
(function () {
  const params = new URLSearchParams(location.search);
  const RENDER = params.get('render') === '1';
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  if (RENDER) document.body.classList.add('render');

  initStage(stage);
  window.renderFrame = renderFrame;

  async function waitAssets() {
    await Promise.all(['400', '500', '600', '700', '800'].map(w => document.fonts.load(w + ' 24px Inter')));
    await document.fonts.ready;
    await Promise.all(Array.from(stage.querySelectorAll('img')).map(im => (im.decode ? im.decode().catch(() => {}) : null)));
  }
  const ready = (async () => {
    await waitAssets();
    initMeasure();
    renderFrame(0);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    return true;
  })();
  window.ACD = { ready, FPS, DURATION, TOTAL_FRAMES, TOTALS, CUES, NARRATION, renderFrame, audio: AUDIO, soundEvents: () => buildSoundEvents() };

  function fit() {
    const w = viewport.clientWidth, h = viewport.clientHeight, s = Math.min(w / 1920, h / 1080);
    stage.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }
  fit(); window.addEventListener('resize', fit);
  if (RENDER) return; // export mode: no UI, no audio playback, the exporter drives renderFrame()

  /* ------------------------------------------------------------ state */
  const P = { playing: false, t: 0, startT: 0, startPerf: 0, ctx: null, gain: null, src: null, buffer: null, mix: null,
    audioT0: 0, ctxT0: 0, audioClock: false, muted: params.get('mute') === '1', lastFrame: -1 };
  window.ACD_SUBS = params.get('subs') !== '0';
  // read-only state for tools/check-player.js
  window.ACD.player = { get state() { return { playing: P.playing, t: P.playing ? now() : P.t, frame: P.lastFrame, muted: P.muted, gain: P.gain ? P.gain.gain.value : null, ctx: P.ctx ? P.ctx.state : null, audioClock: P.audioClock, buffer: !!P.buffer, clean: document.body.classList.contains('clean'), subs: window.ACD_SUBS }; } };
  const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0'); };

  /* ------------------------------------------------------------ UI */
  const startOv = document.getElementById('startOverlay');
  const ctl = document.getElementById('controls');
  ctl.innerHTML =
    '<div class="ctl-row">' +
      '<button class="ctl-btn primary" id="bPlay" aria-label="Main">▶ Main</button>' +
      '<button class="ctl-btn" id="bRestart" aria-label="Mula semula">⟲ Mula Semula</button>' +
      '<span class="ctl-time" id="tTime">00:00.00 / 01:30.00</span>' +
      '<div class="ctl-scrub-wrap"><input id="scrub" type="range" min="0" max="' + (TOTAL_FRAMES - 1) + '" step="1" value="0" aria-label="Garis masa"><div class="scene-marks" id="marks"></div></div>' +
      '<button class="ctl-btn" id="bMute" aria-label="Bunyi">🔊 Bunyi: Hidup</button>' +
      '<button class="ctl-btn" id="bSubs" aria-label="Sari kata">Sari Kata: Hidup</button>' +
      '<button class="ctl-btn" id="bSpeech" aria-label="Suara Bahasa Melayu pelayar" disabled>Suara BM (ms-MY)</button>' +
      '<button class="ctl-btn" id="bFull" aria-label="Skrin penuh">⛶ Skrin Penuh</button>' +
      '<button class="ctl-btn" id="bClean" aria-label="Mod rakaman bersih">● Mod Rakaman Bersih</button>' +
    '</div>' +
    '<div class="scene-btns" id="scenes">' + SCENES.map(s => '<button class="scene-btn" data-s="' + s.id + '">' + s.id + ' · ' + s.key + '</button>').join('') +
      '<span class="ctl-hint">Ruang: main/jeda · R: mula semula · ←/→: ±1 s · , / .: satu bingkai · 1–6: babak · F: skrin penuh · M: bunyi · S: sari kata · C: mod bersih (Esc keluar)</span></div>';
  const $b = id => document.getElementById(id);
  $b('marks').innerHTML = SCENES.slice(1).map(s => '<i style="left:' + (s.start / DURATION * 100) + '%"></i>').join('');
  const startStatus = document.getElementById('startStatus');
  const SP = { enabled: false, voice: null, last: -1 };
  let scrubbing = false, scrubWas = false;

  function updateUI(t) {
    $b('tTime').textContent = fmt(t) + ' / ' + fmt(DURATION) + '  ·  f' + Math.floor(t * FPS + 1e-6);
    if (!scrubbing) $b('scrub').value = String(Math.floor(t * FPS + 1e-6));
    $b('bPlay').textContent = P.playing ? '❚❚ Jeda' : '▶ Main';
    $b('bPlay').setAttribute('aria-label', P.playing ? 'Jeda' : 'Main');
    const sc = SCENES.find(s => t >= s.start && t < s.end) || SCENES[5];
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.toggle('on', +b.dataset.s === sc.id));
    $b('bMute').textContent = P.muted ? '🔇 Bunyi: Mati' : '🔊 Bunyi: Hidup';
    $b('bSubs').textContent = 'Sari Kata: ' + (window.ACD_SUBS ? 'Hidup' : 'Mati');
    $b('bSpeech').classList.toggle('on', SP.enabled);
    $b('bClean').classList.toggle('on', document.body.classList.contains('clean'));
  }
  function renderAt(t, force) {
    const f = Math.min(TOTAL_FRAMES - 1, Math.floor(t * FPS + 1e-6));
    if (f !== P.lastFrame || force) { renderFrame(f); P.lastFrame = f; }
    updateUI(f / FPS);
  }

  /* ------------------------------------------------------------ audio */
  async function unlockAudio() {
    if (P.ctx) { if (P.ctx.state === 'suspended') await P.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { P.ctx = new AC({ sampleRate: 48000 }); } catch (e) { P.ctx = new AC(); }
    P.gain = P.ctx.createGain(); P.gain.gain.value = P.muted ? 0 : 1; P.gain.connect(P.ctx.destination);
    if (P.ctx.state === 'suspended') await P.ctx.resume().catch(() => {});
    attachBuffer();
  }
  function attachBuffer() {
    if (!P.ctx || !P.mix || P.buffer) return;
    const b = P.ctx.createBuffer(2, P.mix.length, P.mix.sampleRate);
    b.copyToChannel(P.mix.L, 0); b.copyToChannel(P.mix.R, 1);
    P.buffer = b;
    if (P.playing) { P.t = now(); P.startT = P.t; P.startPerf = performance.now(); startAudio(P.t); }
  }
  function startAudio(t) {
    stopAudio();
    if (!P.ctx || !P.buffer) { P.audioClock = false; return; }
    const src = P.ctx.createBufferSource(); src.buffer = P.buffer; src.connect(P.gain);
    const when = P.ctx.currentTime + 0.03;
    src.start(when, Math.max(0, t));
    P.src = src; P.ctxT0 = when; P.audioT0 = t; P.audioClock = true;
  }
  function stopAudio() { if (P.src) { try { P.src.stop(); } catch (e) {} P.src.disconnect(); P.src = null; } P.audioClock = false; }
  function now() {
    if (!P.playing) return P.t;
    if (P.audioClock && P.ctx) return P.audioT0 + Math.max(0, P.ctx.currentTime - P.ctxT0);
    return P.startT + (performance.now() - P.startPerf) / 1000;
  }
  // compute the mix in the background so the first click is instant
  AUDIO.render(p => { if (startStatus) startStatus.textContent = 'Menyediakan audio… ' + Math.round(p * 100) + '%'; })
    .then(mix => { P.mix = mix; if (startStatus) startStatus.textContent = 'Sedia · luar talian'; attachBuffer(); });

  /* ------------------------------------------------------------ Web Speech (optional ms-MY preview) */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    SP.voice = vs.find(v => /^ms([-_]|$)/i.test(v.lang)) || null;
    const b = $b('bSpeech');
    b.disabled = !SP.voice;
    b.title = SP.voice ? 'Pratonton naratif dengan suara pelayar: ' + SP.voice.name : 'Tiada suara Bahasa Melayu (ms-MY) dalam pelayar ini';
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  else $b('bSpeech').title = 'Pelayar ini tidak menyokong Web Speech';
  function speechCancel() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speechFrom(t) { SP.last = -1; NARRATION.forEach((n, i) => { if (n.start < t - 0.05) SP.last = i; }); }
  function speechTick(t) {
    if (!SP.enabled || !SP.voice || !P.playing) return;
    for (let i = SP.last + 1; i < NARRATION.length; i++) {
      const n = NARRATION[i];
      if (t >= n.start && t < n.end) {
        SP.last = i;
        const u = new SpeechSynthesisUtterance(n.say); u.voice = SP.voice; u.lang = SP.voice.lang; u.rate = 1.05;
        speechSynthesis.speak(u);
      } else break;
    }
  }

  /* ------------------------------------------------------------ transport */
  let raf = 0;
  function loop() {
    raf = 0;
    if (!P.playing) return;
    const t = now();
    if (t >= DURATION - 1 / FPS) { P.playing = false; P.t = DURATION - 1 / FPS; stopAudio(); renderAt(P.t, true); showControls(); return; }
    renderAt(t);
    speechTick(t);
    raf = requestAnimationFrame(loop);
  }
  function play() {
    if (P.playing) return;
    if (P.t >= DURATION - 1 / FPS - 1e-6) P.t = 0;
    P.playing = true; P.startT = P.t; P.startPerf = performance.now();
    startAudio(P.t); speechFrom(P.t);
    if (!raf) raf = requestAnimationFrame(loop);
    scheduleHide();
  }
  function pause() {
    if (!P.playing) return;
    P.t = Math.floor(now() * FPS) / FPS; P.playing = false;
    stopAudio(); speechCancel(); renderAt(P.t, true); showControls();
  }
  function seek(t) {
    const was = P.playing;
    if (was) { stopAudio(); speechCancel(); }
    P.t = clamp(Math.floor(t * FPS + 1e-6) / FPS, 0, DURATION - 1 / FPS);
    if (was) { P.startT = P.t; P.startPerf = performance.now(); startAudio(P.t); speechFrom(P.t); }
    renderAt(P.t, true);
  }
  function restart() { seek(0); if (!P.playing) play(); }
  async function gesture() { startOv.style.display = 'none'; await unlockAudio(); }

  /* ------------------------------------------------------------ controls wiring */
  $b('bPlay').addEventListener('click', async () => { await gesture(); P.playing ? pause() : play(); });
  $b('bRestart').addEventListener('click', async () => { await gesture(); restart(); });
  $b('bMute').addEventListener('click', async () => { await gesture(); P.muted = !P.muted; if (P.gain) P.gain.gain.value = P.muted ? 0 : 1; updateUI(P.playing ? now() : P.t); });
  $b('bSubs').addEventListener('click', () => { window.ACD_SUBS = !window.ACD_SUBS; renderAt(P.playing ? now() : P.t, true); });
  $b('bSpeech').addEventListener('click', async () => { await gesture(); SP.enabled = !SP.enabled; speechCancel(); speechFrom(P.playing ? now() : P.t); updateUI(P.playing ? now() : P.t); });
  $b('bFull').addEventListener('click', toggleFull);
  $b('bClean').addEventListener('click', () => setClean(true));
  document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', async () => { await gesture(); seek(SCENES[+b.dataset.s - 1].start); }));
  const scrub = $b('scrub');
  scrub.addEventListener('pointerdown', () => { scrubbing = true; scrubWas = P.playing; if (P.playing) pause(); });
  scrub.addEventListener('input', () => { seek(+scrub.value / FPS); });
  const endScrub = async () => { if (!scrubbing) return; scrubbing = false; if (scrubWas) { await gesture(); play(); } };
  scrub.addEventListener('pointerup', endScrub); scrub.addEventListener('change', endScrub);
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen && document.exitFullscreen();
  }
  function setClean(on) { document.body.classList.toggle('clean', on); if (on) startOv.style.display = 'none'; updateUI(P.playing ? now() : P.t); }
  window.addEventListener('keydown', async e => {
    if (e.target && e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Escape') { /* let the slider handle arrows */ }
    const k = e.key;
    if (k === ' ' || k === 'k') { e.preventDefault(); await gesture(); P.playing ? pause() : play(); }
    else if (k === 'r' || k === 'R') { await gesture(); restart(); }
    else if (k === 'ArrowRight') { e.preventDefault(); seek((P.playing ? now() : P.t) + (e.shiftKey ? 5 : 1)); }
    else if (k === 'ArrowLeft') { e.preventDefault(); seek((P.playing ? now() : P.t) - (e.shiftKey ? 5 : 1)); }
    else if (k === '.') { pause(); seek(P.t + 1 / FPS); }
    else if (k === ',') { pause(); seek(P.t - 1 / FPS); }
    else if (k >= '1' && k <= '6') { await gesture(); seek(SCENES[+k - 1].start); }
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'm' || k === 'M') $b('bMute').click();
    else if (k === 's' || k === 'S') $b('bSubs').click();
    else if (k === 'c' || k === 'C') setClean(!document.body.classList.contains('clean'));
    else if (k === 'Escape') setClean(false);
    showControls();
  });
  // auto-hide while playing
  let hideTimer = 0;
  function showControls() { ctl.classList.remove('hidden'); document.body.style.cursor = ''; scheduleHide(); }
  function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (P.playing && !scrubbing) { ctl.classList.add('hidden'); document.body.style.cursor = 'none'; } }, 2500); }
  window.addEventListener('mousemove', showControls);
  window.addEventListener('pointerdown', e => { if (!ctl.contains(e.target) && e.target !== startOv && !startOv.contains(e.target)) showControls(); });

  // first user gesture unlocks audio
  const startClick = async () => { await gesture(); play(); };
  startOv.addEventListener('click', startClick);
  startOv.addEventListener('keydown', e => { if (e.key === 'Enter') startClick(); });

  if (params.get('clean') === '1') setClean(true);
  ready.then(() => {
    const t0 = parseFloat(params.get('t'));
    renderAt(isFinite(t0) ? clamp(t0, 0, DURATION - 1 / FPS) : 0, true);
    if (isFinite(t0)) P.t = clamp(Math.floor(t0 * FPS) / FPS, 0, DURATION - 1 / FPS);
  });
})();

</script>
</body>
