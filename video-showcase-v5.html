function simBadge(extra) { return '<div class="sim-badge ' + (extra || '') + '"><span class="sim-dot"></span>DATA SIMULASI</div>'; }
function protoBadge(extra) { return '<div class="proto-badge ' + (extra || '') + '"><span class="proto-dot"></span>PROTOTAIP INTEGRASI</div>'; }

/* ================================================================ NADI window */
function nadiCard() {
  const c = NADI_CARD, T = TOTALS;
  const box = (label, value, sub, cls) => '<div class="bg-[#F8FAFC] border border-[#DDE5EC] rounded-[8px] p-2.5"><span class="text-slate-500 block text-[11px]">' + label + '</span>' +
    '<span class="' + cls + '">' + value + '</span><span class="text-[10px] text-slate-500 mt-0.5 block">' + sub + '</span></div>';
  const kpi = (n, l, ref, cls) => '<div class="na-kpi ' + (cls || '') + '"' + R(ref) + '><span class="na-kpi-n">' + n + '</span><span class="na-kpi-l">' + l + '</span></div>';
  return '<div class="na-card"' + R('na.card') + '>' +
    '<div class="na-card-head border-b border-slate-200 pb-2.5">' +
      '<div class="flex items-center justify-between gap-2">' +
        '<span class="inline-flex items-center gap-1 text-[11px] font-bold text-amber-900 bg-amber-50 border border-amber-300 px-2 py-0.5 rounded-[6px]"><i class="na-ico amber">' + ICON.alert + '</i>' + c.statusLabel + '</span>' +
        '<div class="flex items-center gap-1.5">' + simBadge('na-sim') + '<span class="na-x">×</span></div>' +
      '</div>' +
      '<h3 class="text-[16px] font-bold text-[#102A43] mt-1.5 leading-snug">' + esc(c.name) + '</h3>' +
      '<p class="text-[12px] text-slate-500 mt-0.5">' + esc(c.area) + '</p>' +
    '</div>' +
    '<div class="na-card-body"' + R('na.cardBody') + '><div class="na-card-scroll"' + R('na.cardScroll') + '><div class="space-y-3 pt-3">' +
    '<div class="grid grid-cols-2 gap-2 text-[12px]"' + R('na.grid') + '>' +
      box('Kes Wabak', c.outbreakCases + ' Kes', 'Kategori: WT', 'text-[18px] font-bold text-[#102A43] font-mono tabular-nums mt-0.5 block') +
      box('Jumlah Kes Lokaliti', c.cumulativeCases + ' Kes', 'Kumulatif Keseluruhan 2026', 'text-[18px] font-bold text-[#1E3A8A] font-mono tabular-nums mt-0.5 block') +
      box('Notifikasi Terakhir', c.lastNotification, 'ME ' + c.epidWeek, 'text-[12px] font-bold text-[#102A43] font-mono mt-0.5 block') +
      box('TJT Wabak (+14h)', c.expectedEnd, c.daysSince + 'h sejak notifikasi', 'text-[12px] font-bold font-mono mt-0.5 block text-amber-700') +
    '</div>' +
    /* prototype action: open the ACD operation in e-ACD (00:21–00:24) */
    '<div class="na-open"' + R('na.open') + '><div class="na-open-in"' + R('na.openIn') + '>' +
      '<div class="flex items-center gap-1.5 font-bold text-[#102A43] text-[12px]"><i class="na-ico teal">' + ICON.clipboard + '</i>Operasi ACD · e-ACD Denggi</div>' +
      '<div class="flex flex-wrap gap-1.5 mt-1.5">' + protoBadge() + simBadge() + '</div>' +
      '<div class="text-[11px] text-slate-600 mt-1.5">Pengesanan kes aktif · ' + esc(c.name) + ' · 04-11-2026 · 6 pasukan</div>' +
      '<span class="na-open-btn"' + R('na.openBtn') + '><i class="na-ico">' + ICON.phoneIcon + '</i><span' + R('na.openText') + '>Buka Operasi ACD</span><i class="na-ico">' + ICON.chevR + '</i></span>' +
    '</div></div>' +
    /* e-ACD summary in NADI: integration prototype (01:25–01:45) */
    '<div class="na-proto"' + R('na.proto') + '><div class="na-proto-in"' + R('na.protoIn') + '>' +
      '<div class="flex items-center justify-between gap-2"><span class="font-bold text-[#102A43] text-[12px] flex items-center gap-1.5"><i class="na-ico teal">' + ICON.clipboard + '</i>Ringkasan e-ACD · Operasi 04-11-2026</span></div>' +
      '<div class="flex flex-wrap gap-1.5 mt-1.5">' + protoBadge() + simBadge() + '</div>' +
      '<div class="grid grid-cols-4 gap-1.5 mt-2">' +
        kpi(T.locality, 'Sasaran premis', 'na.kTarget') + kpi(T.visited, 'Dilawati', 'na.kVisited', 'ok') +
        kpi(T.locked, 'Berkunci / kosong', 'na.kLocked', 'warn') + kpi(T.unvisited, 'Belum dilawati', 'na.kLeft', 'left') +
      '</div>' +
      '<div class="text-[11px] text-slate-600 mt-2">Liputan ACD <b class="font-mono text-[#102A43]">' + T.pct + '%</b> (' + T.visited + '/' + T.locality + ') · sasaran KKM ≥ ' + TARGET_PCT + '%</div>' +
      '<div class="na-decision">' +
        '<span class="na-dec-k">Keputusan<br>penyelia</span>' +
        '<span class="na-dec-btn"' + R('na.decBtn') + '><i class="na-ico">' + ICON.calendar + '</i><span' + R('na.decText') + '>Rancang lawatan susulan</span></span>' +
        '<div class="na-planned-wrap"' + R('na.plannedWrap') + '><div class="na-planned"' + R('na.planned') + '><div class="na-planned-h"><i class="na-ico teal">' + ICON.check + '</i>Lawatan susulan dirancang · ' + FOLLOW_UP.length + ' premis</div>' +
          '<div class="na-planned-list">' + FOLLOW_UP.map((p, i) => '<span><b>' + (i + 1) + '</b>' + esc(p) + '</span>').join('') + '</div>' +
          '<div class="na-recheck"' + R('na.recheck') + '><i class="na-ico amber">' + ICON.lock + '</i>Semak semula status · ' + T.locked + ' premis berkunci / kosong</div></div></div>' +
      '</div>' +
    '</div></div>' +
    '<div class="bg-[#F8FAFC] border border-[#DDE5EC] rounded-[8px] p-3 text-[12px] space-y-2">' +
      '<div class="font-bold text-[#102A43] flex items-center justify-between"><span class="flex items-center gap-1.5"><i class="na-ico teal">' + ICON.calendar + '</i>Kawalan Kesihatan Awam</span>' +
      '<span class="text-[11px] font-mono text-[#006B5B] font-semibold">' + c.premisesInspected + ' Premis Diperiksa</span></div>' +
      '<div class="grid grid-cols-2 gap-1.5 font-mono text-[11px]">' +
        [['PTP P1', c.ptpP1], ['PTP P2', c.ptpP2], ['SRT P1', c.srtP1], ['SRT P2', c.srtP2]].map(([k, v]) =>
          '<div class="bg-white border border-[#DDE5EC] rounded-[6px] p-1.5"><span class="text-slate-500 na-sans block text-[10px]">' + k + '</span><span class="font-bold text-[#102A43]">' + v + '</span></div>').join('') +
      '</div></div>' +
    '<div class="pt-3 border-t border-slate-200"><span class="na-ai-btn"><i class="na-ico">' + ICON.sparkles + '</i><span>Analisis Kawalan AI (' + esc(c.name) + ')</span><i class="na-ico">' + ICON.chevR + '</i></span></div>' +
  '</div></div></div>' +
  '</div>';
}

  return '<div class="nadi-app"' + R('na.app') + '>' +

        '<img class="na-jata" src="' + JATA_SRC + '" alt="Jata Negara"/><div class="leading-tight"><div class="na-pkd1">Pejabat Kesihatan Daerah</div><div class="na-pkd2">Muallim</div></div></div>' +
    '</header>' +
    '<div class="na-toolbar">' +
      '<div class="flex items-center gap-2 flex-wrap">' +

        '<span class="na-quick-k">Fokus Pantas:</span><span class="na-qbtn">Kg. Ketoyong <span class="font-mono">(' + NADI_CARD.cumulativeCases + ')</span></span>' +

/* Summary table "Jadual Hasil Dapatan ACD Mengikut Pasukan" (source summaryTableBody). */
function summaryTable(p, mobile) {
  const rows = [['locality', 'Jumlah Rumah/Premis dalam Lokaliti'], ['visited', 'Jumlah Rumah/Premis Dilawati'], ['locked', 'Jumlah Rumah/Premis Berkunci / Kosong'],
    ['pop', 'Jumlah Penduduk Diperiksa (ACD)'], ['symp', 'Jumlah Kes Bergejala Dikesan', 'rose'], ['ref', 'Jumlah Rujukan Ke Fasiliti Kesihatan'],
    ['sample', 'Jumlah Sampel Diambil di Lapangan'], ['pct', 'Pencapaian ACD (%)', 'pct']];
  let body = '';
  rows.forEach(([key, label, kind], r) => {
    let cells = '';
    for (let t = 1; t <= 6; t++) {
      const v = kind === 'pct' ? (calcTeamPct(TEAMS[t]) + '%') : TEAMS[t][key];
      cells += '<td class="p-2 text-center tnum ' + (kind === 'pct' ? 'font-extrabold text-teal-900 bg-teal-50/60' : 'text-slate-700') + '"' + R(p + 'tc' + r + '_' + t) + '>' + v + '</td>';
    }
    body += '<tr class="' + (kind === 'pct' ? 'bg-teal-50/80 font-bold border-t-2 border-teal-200' : '') + '"><td class="p-2 pl-3 font-semibold ' + (kind === 'rose' ? 'text-rose-700' : 'text-slate-800') + '">' + label + '</td>' + cells +
      '<td class="p-2 text-center font-extrabold tnum ' + (kind === 'rose' ? 'bg-rose-100 text-rose-800' : 'bg-amber-50 text-slate-950') + '"' + R(p + 'tt' + r) + '>' + (kind === 'pct' ? TOTALS.pct + '%' : TOTALS[key]) + '</td></tr>';
  });
  const buttons = '<div class="flex flex-wrap items-center gap-2' + (mobile ? ' mt-2.5' : '') + '">' +
    '<span class="text-xs font-bold bg-emerald-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm"' + R(p + 'btnWa') + '><span>Salin Laporan (WhatsApp)</span></span>' +
    '<span class="text-xs font-bold bg-slate-800 text-white px-3 py-1.5 rounded-lg shadow-sm">Muat Turun CSV</span>' +
    '<span class="text-xs font-bold bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-lg">Cetak</span></div>';
  return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative"' + R(p + 'table') + '>' +
    '<div class="p-4 border-b border-slate-200 ' + (mobile ? '' : 'flex items-center justify-between gap-3 ') + 'bg-slate-50"' + R(p + 'tableHead') + '>' +
      '<div><h3 class="text-sm font-extrabold text-slate-900 uppercase">Jadual Hasil Dapatan ACD Mengikut Pasukan</h3>' +
      '<p class="text-xs text-slate-500">Jumlah dan peratusan Pencapaian ACD (%) dikira secara automatik.</p></div>' + buttons + '</div>' +
    '<div class="' + (mobile ? 'overflow-hidden' : '') + '"><table class="' + (mobile ? 'w-[760px]' : 'w-full') + ' text-xs text-left border-collapse"><thead><tr class="bg-teal-900 text-white font-bold text-center">' +
      '<th class="p-2.5 text-left">PERKARA</th>' + [1, 2, 3, 4, 5, 6].map(t => '<th class="p-2"' + R(p + 'th' + t) + '>Pasukan ' + t + '</th>').join('') +
      '<th class="p-2 bg-amber-500 text-slate-950"' + R(p + 'thTot') + '>Jumlah</th></tr></thead><tbody class="divide-y divide-slate-200">' + body + '</tbody></table></div>' +
    '<div class="col-hl"' + R(p + 'colHl') + '></div></div>';
}

/* ---------------------------------------------------------------- charts from the 90-second film */
/* SVG bar chart that mimics the Chart.js bar chart of the source (3 datasets, 6 teams). */
function barChartSvg(p, W, H) {
  const padL = 34, padR = 8, padT = 10, legendH = 34, xLabH = 22;
  const plotW = W - padL - padR, plotH = H - padT - legendH - xLabH, maxY = 20;
  let g = '';
  for (let v = 0; v <= maxY; v += 5) {
    const y = padT + plotH - (v / maxY) * plotH;
    g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="#e2e8f0" stroke-width="1"/>' +
         '<text x="' + (padL - 7) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="11" fill="#64748b">' + v + '</text>';
  }
  const groupW = plotW / 6, catW = groupW * 0.8, barW = (catW / 3) * 0.9;
  const colors = ['#94a3b8', '#0d9488', '#f59e0b'];
  let bars = '';
  for (let t = 1; t <= 6; t++) {
    const gx = padL + groupW * (t - 1) + (groupW - catW) / 2;
    for (let k = 0; k < 3; k++) {
      const x = gx + (catW / 3) * k + ((catW / 3) - barW) / 2;
      bars += '<path fill="' + colors[k] + '" d=""' + R(p + 'bar' + t + '_' + k) + ' data-x="' + x.toFixed(2) + '" data-w="' + barW.toFixed(2) + '"/>';
    }
    g += '<text x="' + (padL + groupW * (t - 0.5)) + '" y="' + (padT + plotH + 16) + '" text-anchor="middle" font-size="11" fill="#64748b">Pasukan ' + t + '</text>';
  }
  const legend = [['Dalam Lokaliti', colors[0]], ['Dilawati', colors[1]], ['Berkunci / Kosong', colors[2]]];
  let lx = W / 2 - 150, ly = H - 12, lg = '';
  for (const [label, c] of legend) {
    lg += '<rect x="' + lx + '" y="' + (ly - 10) + '" width="12" height="12" fill="' + c + '"/><text x="' + (lx + 17) + '" y="' + ly + '" font-size="11" fill="#475569">' + label + '</text>';
    lx += 18 + label.length * 6.2 + 16;
  }
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' + R(p + 'barSvg') + ' data-plot="' + [padL, padT, plotW, plotH, maxY].join(',') + '">' + g + bars + lg + '</svg>';
}
/* SVG doughnut mimicking the Chart.js doughnut (cutout 64%, white 2px borders). */
function doughnutSvg(p, W, H) {
  const legendH = 34, cx = W / 2, cy = (H - legendH) / 2 + 2, r = Math.min(W, H - legendH) / 2 - 8;
  const items = [['Dilawati', '#0d9488'], ['Berkunci / Kosong', '#f59e0b'], ['Belum Dilawati', '#cbd5e1']];
  let lg = '', lx;
  const widths = items.map(([l]) => 18 + l.length * 6.1 + 12);
  lx = (W - widths.reduce((a, b) => a + b, 0)) / 2;
  const ly = H - 12;
  items.forEach(([label, c], i) => {
    lg += '<rect x="' + lx + '" y="' + (ly - 10) + '" width="12" height="12" fill="' + c + '"/><text x="' + (lx + 17) + '" y="' + ly + '" font-size="11" fill="#475569">' + label + '</text>';
    lx += widths[i];
  });
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' + R(p + 'donutSvg') + ' data-geo="' + [cx, cy, r, r * 0.64].join(',') + '">' +
    '<path fill="#0d9488" stroke="#fff" stroke-width="2" d=""' + R(p + 'arc0') + '/>' +
    '<path fill="#f59e0b" stroke="#fff" stroke-width="2" d=""' + R(p + 'arc1') + '/>' +
    '<path fill="#cbd5e1" stroke="#fff" stroke-width="2" d=""' + R(p + 'arc2') + '/>' + lg + '</svg>';
}

/* ==========================================================================
 * engine.js — deterministic timeline for the 120-second NADI Muallim film (V3).
 * renderFrame(frameIndex) is a pure function of the frame number
 * (t = frameIndex / 60): it recomputes every animated property from t, so
 * seeking to a frame and playing up to it give the same pixels. No CSS
 * transitions or animations, no Math.random().
 *
 * V3 follows the 19 supplied narration cues: dark illustrative map and the
 * supervisor's question (0–4 s), the manual process with the re-typing beat
 * finished by 11.85 s, the title impact at 13.35 s, the NADI locality card,
 * and the phone layer gated at 24.30 s (frame 1458). Devices use a shallow
 * 3D angle while moving and settle near frontal for reading.
 * ========================================================================== */
'use strict';

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

/* Analytic damped spring, normalised so f(0)=0 and f(1)=1 (subtle overshoot). */
function makeSpring(zeta, w) {
  const wd = w * Math.sqrt(1 - zeta * zeta);
  const f = p => 1 - Math.exp(-zeta * w * p) * (Math.cos(wd * p) + (zeta * w / wd) * Math.sin(wd * p));
  const end = f(1);
  return p => (p <= 0 ? 0 : p >= 1 ? 1 : f(p) / end);
}
const E = {
  lin: p => p,
  outQuad: p => 1 - (1 - p) * (1 - p),
  inQuad: p => p * p,
  inCubic: p => p * p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2), // as Motion Canvas easeInOutCubic
  outQuart: p => 1 - Math.pow(1 - p, 4),
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: makeOutBack(1.25),
  spring: makeSpring(0.62, 11),
  springSoft: makeSpring(0.78, 10)
};
/* progress of t through [t0, t1] with easing; 0 before, 1 after */
function seg(t, t0, t1, e) { if (t <= t0) return 0; if (t >= t1) return 1; return (e || E.inOutCubic)((t - t0) / (t1 - t0)); }

    [T.i.move[0], CAM_F.FO], [T.i.move[1], ID], [T.j.reveal[0], ID], [T.j.reveal[0] + 0.01, CAM_F.J0, E.lin], [T.j.reveal[1], CAM_F.J1, E.inOutCubic],

/* ---------------------------------------------------------------- touch indicator (phone) */
function touchState(taps, t, posFn) {
  // finger visible from 0.5 s before a tap to 0.4 s after; glides between close taps
  let cur = -1;
  for (let i = 0; i < taps.length; i++) { if (taps[i].t - 0.5 <= t) cur = i; }
  if (cur < 0) return null;
  const tp = taps[cur], prev = cur > 0 ? taps[cur - 1] : null, next = cur < taps.length - 1 ? taps[cur + 1] : null;
  const glide = prev && tp.t - prev.t < 0.95 && tp.layer === prev.layer;
  let o, x, y;
  const target = posFn(tp, t);
  if (glide) {
    const from = posFn(prev, t), p = seg(t, prev.t + 0.1, tp.t - 0.06, E.inOutCubic);
    x = lerp(from.x, target.x, p); y = lerp(from.y, target.y, p); o = 1;
  } else {
    x = target.x; y = target.y + 26 * (1 - seg(t, tp.t - 0.5, tp.t - 0.12, E.outCubic));
    o = seg(t, tp.t - 0.5, tp.t - 0.25, E.outCubic);
  }
  const willGlide = next && next.t - tp.t < 0.95 && next.layer === tp.layer;
  if (!willGlide) o = Math.min(o, 1 - seg(t, tp.t + 0.12, tp.t + 0.4, E.inCubic));
  const press = 1 - 0.14 * win(t, tp.t - 0.07, tp.t, tp.t + 0.02, tp.t + 0.12, E.outQuad, E.inQuad);
  const rp = seg(t, tp.t, tp.t + 0.5, E.outCubic);
  const ripple = t >= tp.t ? { s: lerp(0.5, 2.3, rp), o: 0.75 * (1 - rp) } : { s: 0.5, o: 0 };
  return { x, y, o, press, ripple };
}

  if (!st || st.o <= 0.002) { op(el, 0); op(rip, 0); return; }
  op(el, st.o);
  tf(el, 'translate(' + px(st.x) + ',' + px(st.y) + ') scale(' + r2(st.press) + ')');
  op(rip, st.ripple.o); tf(rip, 'scale(' + r2(st.ripple.s) + ')');
}

  const s = step(t, states);
  txt($[prefix + 'syncText'], s[0]);
  css($[prefix + 'syncDot'], 'background-color', s[1] ? '#fbbf24' : '#34d399');
}
function renderDash(p, t, teams) {
  const tot = computeTotals(teams);
  txt($[p + 'kpiPct'], tot.pct + '%');
  txt($[p + 'kpiRatio'], '(' + tot.visited + ' / ' + tot.locality + ' premis)');
  const ok = tot.locality > 0 && tot.pct >= TARGET_PCT;
  css($[p + 'kpiBar'], 'width', Math.min(100, tot.pct) + '%');
  css($[p + 'kpiBar'], 'background-color', ok ? '#34d399' : '#fbbf24');
  // in-app badge states, as in the e-ACD source and the 90-second film
  const badge = $[p + 'kpiBadge'];
  if (tot.locality === 0) { txt(badge, 'Sasaran ≥ 80%'); css(badge, 'background-color', '#0f766e'); css(badge, 'color', '#ccfbf1'); }
  else if (ok) { txt(badge, 'Capai Sasaran (≥80%)'); css(badge, 'background-color', '#34d399'); css(badge, 'color', '#020617'); }
  else { txt(badge, 'Sedang Berjalan (<80%)'); css(badge, 'background-color', '#fbbf24'); css(badge, 'color', '#020617'); }
  const pop = t >= T_TARGET_CROSS ? win(t, T_TARGET_CROSS, T_TARGET_CROSS + 0.12, T_TARGET_CROSS + 0.2, T_TARGET_CROSS + 0.6, E.outQuad, E.inOutSine) : 0;
  tf(badge, 'scale(' + r2(1 + 0.22 * pop) + ')');
  op($[p + 'targetMark'], seg(t, T.j.mark[0], T.j.mark[1]));
  txt($[p + 'kpiTeams'], tot.activeTeams + '/6 Pasukan Aktif');
  txt($[p + 'mLoc'], String(tot.locality)); txt($[p + 'mVis'], String(tot.visited)); txt($[p + 'mLock'], String(tot.locked));
  txt($[p + 'mPop'], String(tot.pop)); txt($[p + 'mSymp'], String(tot.symp)); txt($[p + 'mRef'], String(tot.ref));
  txt($[p + 'mSample'], tot.sample + ' sampel');
  return tot;
}

const SH_KEYS = ['locality', 'visited', 'locked', 'pop', 'symp', 'ref'];

  camLayer(L, ID);

  placeDevice($.gas, { x: I_GAS.x, y: I_GAS.y + 30 * (1 - a), s: I_GAS.s, rx: 0, ry: 0 });
  placeDevice($.sheet, { x: I_SHEET.x + 260 * (1 - a), y: I_SHEET.y, s: I_SHEET.s, rx: 0, ry: I_SHEET.ry });
  cls($['gas.save'], 'active', t >= T.i.dots1[1] - 0.1 && t < T.i.write + 0.1);
  // C8:H13 written by setValues(): the pre-save matrix, then the post-save matrix (only Pasukan 1 changes);
  // Jumlah (I8:I13) and row 14 (%) are sheet formulas
  const after = t >= T.i.write, teams = after ? TEAMS : TEAMS_BEFORE, tot = computeTotals(teams);

      txt(c.firstChild, v);
      const changed = r < 6 ? TEAMS[k][SH_KEYS[r]] !== TEAMS_BEFORE[k][SH_KEYS[r]] : calcTeamPct(TEAMS[k]) !== calcTeamPct(TEAMS_BEFORE[k]);
      const f = after && changed ? 1 - seg(t, T.i.write, T.i.write + 1.2, E.outQuad) : 0;
      css(c, 'background-color', f > 0.001 ? 'rgba(167,243,208,' + r2(0.25 + 0.75 * f) + ')' : (after && changed ? 'rgba(167,243,208,.25)' : 'transparent'));
    }
  }
  for (let r = 0; r < 7; r++) txt($['sh.tot' + r].firstChild, r < 6 ? String(tot[SH_KEYS[r]]) : tot.pct + '%');
  const sel = $['sh.sel'];

  // one set of data dots, one way
  op($['ov.flow'], o * seg(t, T.i.line[0], T.i.line[1]));
  FLOW.pk.forEach((el, i) => {
    const pi = i < 5 ? 0 : 1, t0 = (pi ? T.i.dots2[0] : T.i.dots1[0]) + (i % 5) * 0.11, q = seg(t, t0, t0 + 0.5, E.inOutCubic);
    const live = t >= t0 && t <= t0 + 0.5;
    attr(el, 'opacity', live ? '1' : '0');
    if (!live) return;
    const pt = FLOW.paths[pi].getPointAtLength(FLOW.lens[pi] * q);
    attr(el, 'cx', pt.x.toFixed(1)); attr(el, 'cy', pt.y.toFixed(1));

}

/* ---------------------------------------------------------------- 10 · monitor */
function barPath(x, y, w, h, r) {
  if (h <= 0.01) return '';
  r = Math.min(r, w / 2, h);
  return 'M' + x.toFixed(2) + ' ' + (y + h).toFixed(2) + 'V' + (y + r).toFixed(2) + 'Q' + x.toFixed(2) + ' ' + y.toFixed(2) + ' ' + (x + r).toFixed(2) + ' ' + y.toFixed(2) +
    'H' + (x + w - r).toFixed(2) + 'Q' + (x + w).toFixed(2) + ' ' + y.toFixed(2) + ' ' + (x + w).toFixed(2) + ' ' + (y + r).toFixed(2) + 'V' + (y + h).toFixed(2) + 'Z';
}
function arcPath(cx, cy, Rr, r, a0, a1) {
  if (a1 - a0 < 0.0005) return '';
  if (a1 - a0 >= Math.PI * 2 - 1e-4) a1 = a0 + Math.PI * 2 - 1e-4;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const p = (rad, a) => (cx + Math.cos(a) * rad).toFixed(2) + ' ' + (cy + Math.sin(a) * rad).toFixed(2);
  return 'M' + p(Rr, a0) + 'A' + Rr + ' ' + Rr + ' 0 ' + large + ' 1 ' + p(Rr, a1) + 'L' + p(r, a1) + 'A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(r, a0) + 'Z';
}
function renderDesktop(t, o) {
  const L = $['w.desk'];

  op(L, o);
  camLayer(L, camAt('desk', t));
  placeDevice($.desktop, kf(t, DESK_KEYS));
  tf($['dk.scroll'], 'translateY(0px)');
  setSync('dk.', t, [[0, ['Sheet Diselaraskan', 0]]]);
  // the charts follow the same count-up as the figures (secondary to the coverage card)
  const teams = teamsDash(t), tot = renderDash('dk.', t, teams);
  const [pl, pt, pw, ph, maxY] = M.bar;
  for (let k = 1; k <= 6; k++) {
    const vals = [teams[k].locality, teams[k].visited, teams[k].locked];
    for (let j = 0; j < 3; j++) {
      const el = $['dk.bar' + k + '_' + j], x = +el.dataset.x, w = +el.dataset.w, h = (vals[j] / maxY) * ph;
      attr(el, 'd', barPath(x, pt + ph - h, w, h, 6));
    }
  }
  const [cx, cy, Rr, r] = M.donut, dData = [tot.visited, tot.locked, tot.unvisited], sum = dData.reduce((a, b) => a + b, 0);
  let a0 = -Math.PI / 2;
  for (let i = 0; i < 3; i++) { const a1 = sum > 0 ? a0 + (dData[i] / sum) * Math.PI * 2 : a0; attr($['dk.arc' + i], 'd', arcPath(cx, cy, Rr, r, a0, a1)); a0 = a1; }
}

  function now() {
    if (!P.playing) return P.t;
    if (P.audioClock && P.ctx) return P.audioT0 + Math.max(0, P.ctx.currentTime - P.ctxT0);
    return P.startT + (performance.now() - P.startPerf) / 1000;
  }
  // compute the mix (narration + ducked score) in the background so the first click is instant
  AUDIO.render(p => { if (startStatus) startStatus.textContent = 'Menyediakan audio dan narasi… ' + Math.round(p * 100) + '%'; })
    .then(mix => {
      P.mix = mix;
      const n = mix.info.narration;
      if (startStatus) startStatus.textContent = n ? 'Sedia · narasi ' + n.label + ' · luar talian' : 'Sedia · muzik latar sahaja (tanpa narasi) · luar talian';
      attachBuffer();
    })
    .catch(e => { if (startStatus) startStatus.textContent = 'Audio gagal disediakan: ' + (e && e.message ? e.message : e); });

  /* ------------------------------------------------------------ transport */
  let raf = 0;
  function loop() {
    raf = 0;
    if (!P.playing) return;
    const t = now();
    if (t >= DURATION - 1 / FPS) { P.playing = false; P.t = DURATION - 1 / FPS; stopAudio(); renderAt(P.t, true); showControls(); return; }
    renderAt(t);
    raf = requestAnimationFrame(loop);
  }
  function play() {
    if (P.playing) return;
    if (P.t >= DURATION - 1 / FPS - 1e-6) P.t = 0;
    P.playing = true; P.startT = P.t; P.startPerf = performance.now();
    startAudio(P.t);
    if (!raf) raf = requestAnimationFrame(loop);
    scheduleHide();
  }
  function pause() {
    if (!P.playing) return;
    P.t = Math.floor(now() * FPS) / FPS; P.playing = false;
    stopAudio(); renderAt(P.t, true); showControls();
  }
  function seek(t) {
    const was = P.playing;
    if (was) stopAudio();
    P.t = clamp(Math.floor(t * FPS + 1e-6) / FPS, 0, DURATION - 1 / FPS);
    if (was) { P.startT = P.t; P.startPerf = performance.now(); startAudio(P.t); }
    renderAt(P.t, true);
  }
  function restart() { seek(0); if (!P.playing) play(); }
  async function gesture() { startOv.style.display = 'none'; await unlockAudio(); }

  /* ------------------------------------------------------------ controls wiring */
  $b('bPlay').addEventListener('click', async () => { await gesture(); P.playing ? pause() : play(); });
  $b('bRestart').addEventListener('click', async () => { await gesture(); restart(); });
  $b('bMute').addEventListener('click', async () => { await gesture(); P.muted = !P.muted; if (P.gain) P.gain.gain.value = P.muted ? 0 : 1; updateUI(P.playing ? now() : P.t); });
  $b('bSubs').addEventListener('click', () => { window.ACD_SUBS = !window.ACD_SUBS; renderAt(P.playing ? now() : P.t, true); });
  $b('bFull').addEventListener('click', toggleFull);
  $b('bClean').addEventListener('click', () => setClean(true));
  document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', async () => { await gesture(); seek(SCENES[+b.dataset.s - 1].start); }));
  const scrub = $b('scrub');
  scrub.addEventListener('pointerdown', () => { scrubbing = true; scrubWas = P.playing; if (P.playing) pause(); });
  scrub.addEventListener('input', () => { seek(+scrub.value / FPS); });
  const endScrub = async () => { if (!scrubbing) return; scrubbing = false; if (scrubWas) { await gesture(); play(); } };
  scrub.addEventListener('pointerup', endScrub); scrub.addEventListener('change', endScrub);
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen && document.exitFullscreen();
  }
  function setClean(on) { document.body.classList.toggle('clean', on); if (on) startOv.style.display = 'none'; updateUI(P.playing ? now() : P.t); }
  window.addEventListener('keydown', async e => {
    if (e.target && e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Escape') { /* let the slider handle arrows */ }
    const k = e.key;
    if (k === ' ' || k === 'k') { e.preventDefault(); await gesture(); P.playing ? pause() : play(); }
    else if (k === 'r' || k === 'R') { await gesture(); restart(); }
    else if (k === 'ArrowRight') { e.preventDefault(); seek((P.playing ? now() : P.t) + (e.shiftKey ? 5 : 1)); }
    else if (k === 'ArrowLeft') { e.preventDefault(); seek((P.playing ? now() : P.t) - (e.shiftKey ? 5 : 1)); }
    else if (k === '.') { pause(); seek(P.t + 1 / FPS); }
    else if (k === ',') { pause(); seek(P.t - 1 / FPS); }
    else if (k >= '1' && k <= String(SCENES.length)) { await gesture(); seek(SCENES[+k - 1].start); }
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'm' || k === 'M') $b('bMute').click();
    else if (k === 's' || k === 'S') $b('bSubs').click();
    else if (k === 'c' || k === 'C') setClean(!document.body.classList.contains('clean'));
    else if (k === 'Escape') setClean(false);
    showControls();
  });
  // auto-hide while playing
  let hideTimer = 0;
  function showControls() { ctl.classList.remove('hidden'); document.body.style.cursor = ''; scheduleHide(); }
  function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (P.playing && !scrubbing) { ctl.classList.add('hidden'); document.body.style.cursor = 'none'; } }, 2500); }
  window.addEventListener('mousemove', showControls);
  window.addEventListener('pointerdown', e => { if (!ctl.contains(e.target) && e.target !== startOv && !startOv.contains(e.target)) showControls(); });

  // first user gesture unlocks audio
  const startClick = async () => { await gesture(); play(); };
  startOv.addEventListener('click', startClick);
  startOv.addEventListener('keydown', e => { if (e.key === 'Enter') startClick(); });

  if (params.get('clean') === '1') setClean(true);
  ready.then(() => {
    const t0 = parseFloat(params.get('t'));
    renderAt(isFinite(t0) ? clamp(t0, 0, DURATION - 1 / FPS) : 0, true);
    if (isFinite(t0)) P.t = clamp(Math.floor(t0 * FPS) / FPS, 0, DURATION - 1 / FPS);
  });
})();

</script>
</body>
</html>
