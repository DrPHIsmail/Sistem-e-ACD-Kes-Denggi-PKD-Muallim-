function calcTeamPct(teamObj) {
  if (!teamObj || !teamObj.locality || teamObj.locality <= 0) return null;
  return Math.round((teamObj.visited / teamObj.locality) * 100);
}
function computeTotals(teams) {
  const totals = { locality: 0, visited: 0, locked: 0, pop: 0, symp: 0, ref: 0, sample: 0, breeding: 0, abate: 0, pamphlet: 0, activeTeams: 0 };
  for (let t = 1; t <= 6; t++) {
    const d = teams[t];
    for (const k of ['locality', 'visited', 'locked', 'pop', 'symp', 'ref', 'sample', 'breeding', 'abate', 'pamphlet']) totals[k] += Number(d[k]) || 0;
    if ((Number(d.locality) || 0) > 0 || (Number(d.visited) || 0) > 0) totals.activeTeams++;
  }
  totals.pct = totals.locality > 0 ? Math.round((totals.visited / totals.locality) * 100) : 0;
  totals.unvisited = Math.max(0, totals.locality - totals.visited - totals.locked);
  return totals;
}

}

const CUES = [

  { id: '1a', scene: 1, start: 0.60,   end: 3.65,   say: 'Selepas operasi pengesanan kes aktif denggi,', sub: 'Selepas operasi pengesanan\nkes aktif denggi,' },

];
const PLANNED = CUES.map(c => ({ id: c.id, start: c.start, end: c.end }));

/* Optional: cue times measured from the recorded takes (tools/sync-narration.js). */
let NARRATION_SOURCE = 'planned';
function applyTiming(t) {
  if (!t || !t.cues) return;
  let n = 0;

/* Summary table "Jadual Hasil Dapatan ACD Mengikut Pasukan" (source summaryTableBody). */
function summaryTable(p, mobile) {
  const rows = [['locality', 'Jumlah Rumah/Premis dalam Lokaliti'], ['visited', 'Jumlah Rumah/Premis Dilawati'], ['locked', 'Jumlah Rumah/Premis Berkunci / Kosong'],
    ['pop', 'Jumlah Penduduk Diperiksa (ACD)'], ['symp', 'Jumlah Kes Bergejala Dikesan', 'rose'], ['ref', 'Jumlah Rujukan Ke Fasiliti Kesihatan'],
    ['sample', 'Jumlah Sampel Diambil di Lapangan'], ['pct', 'Pencapaian ACD (%)', 'pct']];
  let body = '';
  rows.forEach(([key, label, kind], r) => {
    let cells = '';
    for (let t = 1; t <= 6; t++) {
      const v = kind === 'pct' ? (calcTeamPct(TEAMS[t]) + '%') : TEAMS[t][key];
      cells += '<td class="p-2 text-center tnum ' + (kind === 'pct' ? 'font-extrabold text-teal-900 bg-teal-50/60' : 'text-slate-700') + '"' + R(p + 'tc' + r + '_' + t) + '>' + v + '</td>';
    }
    body += '<tr class="' + (kind === 'pct' ? 'bg-teal-50/80 font-bold border-t-2 border-teal-200' : '') + '"><td class="p-2 pl-3 font-semibold ' + (kind === 'rose' ? 'text-rose-700' : 'text-slate-800') + '">' + label + '</td>' + cells +
      '<td class="p-2 text-center font-extrabold tnum ' + (kind === 'rose' ? 'bg-rose-100 text-rose-800' : 'bg-amber-50 text-slate-950') + '"' + R(p + 'tt' + r) + '>' + (kind === 'pct' ? TOTALS.pct + '%' : TOTALS[key]) + '</td></tr>';
  });
  const buttons = '<div class="flex flex-wrap items-center gap-2' + (mobile ? ' mt-2.5' : '') + '">' +
    '<span class="text-xs font-bold bg-emerald-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm"' + R(p + 'btnWa') + '><span>Salin Laporan (WhatsApp)</span></span>' +
    '<span class="text-xs font-bold bg-slate-800 text-white px-3 py-1.5 rounded-lg shadow-sm">Muat Turun CSV</span>' +
    '<span class="text-xs font-bold bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-lg">Cetak</span></div>';
  return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative"' + R(p + 'table') + '>' +
    '<div class="p-4 border-b border-slate-200 ' + (mobile ? '' : 'flex items-center justify-between gap-3 ') + 'bg-slate-50"' + R(p + 'tableHead') + '>' +
      '<div><h3 class="text-sm font-extrabold text-slate-900 uppercase">Jadual Hasil Dapatan ACD Mengikut Pasukan</h3>' +
      '<p class="text-xs text-slate-500">Jumlah dan peratusan Pencapaian ACD (%) dikira secara automatik.</p></div>' + buttons + '</div>' +
    '<div class="' + (mobile ? 'overflow-hidden' : '') + '"><table class="' + (mobile ? 'w-[760px]' : 'w-full') + ' text-xs text-left border-collapse"><thead><tr class="bg-teal-900 text-white font-bold text-center">' +
      '<th class="p-2.5 text-left">PERKARA</th>' + [1, 2, 3, 4, 5, 6].map(t => '<th class="p-2"' + R(p + 'th' + t) + '>Pasukan ' + t + '</th>').join('') +
      '<th class="p-2 bg-amber-500 text-slate-950"' + R(p + 'thTot') + '>Jumlah</th></tr></thead><tbody class="divide-y divide-slate-200">' + body + '</tbody></table></div>' +
    '<div class="col-hl"' + R(p + 'colHl') + '></div></div>';
}

  const stepper = (label, ref, val) => '<div><label class="block text-xs font-bold ' + rose[0] + ' mb-1">' + label + '</label><div class="flex items-center">' +

/* Messaging app on the phone (generic; no third-party branding). */
function phoneChat() {
  const lines = buildWhatsappSummary(META, TOTALS).split('\n').map(l => {
    if (!l.trim()) return '<div class="cl gap"></div>';
    let s = esc(l).replace(/\*(.+?)\*/g, '<b>$1</b>');
    s = s.replace('📍', '<i class="emo">' + ICON.pin.replace('w-3.5 h-3.5 text-amber-400 shrink-0', 'emo-svg') + '</i>').replace('📅', '<i class="emo">' + ICON.calendar + '</i>').replace('📊', '<i class="emo">' + ICON.chart + '</i>');
    return '<div class="cl">' + s + '</div>';
  }).join('');
  return '<div class="ph-chat"' + R('ph.chat') + '>' +
    '<div class="pc-head"><span class="pc-back">' + ICON.chevL + '</span><span class="pc-av">' + ICON.users + '</span><div class="min-w-0"><div class="pc-t">Kumpulan Operasi ACD</div><div class="pc-s">WhatsApp (simulasi) · draf mesej</div></div></div>' +
    '<div class="pc-body"><div class="pc-sim">' + simBadge() + '</div><div class="pc-bubble"' + R('ph.bubble') + '>' + lines + '<div class="pc-draft">Ditampal · belum dihantar</div></div></div>' +

}

/* ---- engine.js ---- */
/* ==========================================================================
 * engine.js — deterministic timeline for the 120-second NADI Muallim film.
 * renderFrame(frameIndex) is a pure function of the frame number
 * (t = frameIndex / 60): it recomputes every animated property from t, so
 * seeking to a frame and playing up to it give the same pixels. No CSS
 * transitions or animations, no Math.random().
 *
 * Each device sits on its own world layer with its own camera, so a shot can
 * dissolve to the next one independently. After every important action the
 * camera holds still so the result can be read; one element carries the
 * visual focus at a time.
 * ========================================================================== */
'use strict';

/* ---------------------------------------------------------------- math */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
function makeOutBack(s) { return p => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); }
/* Analytic damped spring, normalised so f(0)=0 and f(1)=1 (subtle overshoot). */
function makeSpring(zeta, w) {
  const wd = w * Math.sqrt(1 - zeta * zeta);
  const f = p => 1 - Math.exp(-zeta * w * p) * (Math.cos(wd * p) + (zeta * w / wd) * Math.sin(wd * p));
  const end = f(1);
  return p => (p <= 0 ? 0 : p >= 1 ? 1 : f(p) / end);
}
const E = {
  lin: p => p,
  outQuad: p => 1 - (1 - p) * (1 - p),
  inQuad: p => p * p,
  inCubic: p => p * p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2), // as Motion Canvas easeInOutCubic
  outQuart: p => 1 - Math.pow(1 - p, 4),
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: makeOutBack(1.25),
  spring: makeSpring(0.62, 11),
  springSoft: makeSpring(0.78, 10)

/* progress of t through [t0, t1] with easing; 0 before, 1 after */
function seg(t, t0, t1, e) { if (t <= t0) return 0; if (t >= t1) return 1; return (e || E.inOutCubic)((t - t0) / (t1 - t0)); }

function win(t, a, b, c, d, ein, eout) { return Math.min(seg(t, a, b, ein || E.outCubic), 1 - seg(t, c, d, eout || E.inCubic)); }

/* keyframes: [[time, value, easingIntoThisKey?], ...] */
function kf(t, keys) {

    if (t < keys[i][0]) {
      const k0 = keys[i - 1], k1 = keys[i];
      return mix(k0[1], k1[1], (k1[2] || E.inOutCubic)((t - k0[0]) / (k1[0] - k0[0])));

}
/* step keyframes (constant interpolation): [[time, value], ...] */
function step(t, keys) { let v = keys[0][1]; for (const [k, val] of keys) { if (t >= k) v = val; } return v; }

/* ---------------------------------------------------------------- seeded randomness */

function symOpen(t) { return t >= T.s3.toggle && t < T.s3.saved; }

function touchState(taps, t, posFn) {

  if (cur < 0) return null;
  const tp = taps[cur], prev = cur > 0 ? taps[cur - 1] : null, next = cur < taps.length - 1 ? taps[cur + 1] : null;
  const glide = prev && tp.t - prev.t < 0.95 && tp.layer === prev.layer;
  let o, x, y;
  const target = posFn(tp, t);
  if (glide) {
    const from = posFn(prev, t), p = seg(t, prev.t + 0.1, tp.t - 0.06, E.inOutCubic);

  } else {
    x = target.x; y = target.y + 26 * (1 - seg(t, tp.t - 0.5, tp.t - 0.12, E.outCubic));
    o = seg(t, tp.t - 0.5, tp.t - 0.25, E.outCubic);
  }
  const willGlide = next && next.t - tp.t < 0.95 && next.layer === tp.layer;
  if (!willGlide) o = Math.min(o, 1 - seg(t, tp.t + 0.12, tp.t + 0.4, E.inCubic));
  const press = 1 - 0.14 * win(t, tp.t - 0.07, tp.t, tp.t + 0.02, tp.t + 0.12, E.outQuad, E.inQuad);
  const rp = seg(t, tp.t, tp.t + 0.5, E.outCubic);
  const ripple = t >= tp.t ? { s: lerp(0.5, 2.3, rp), o: 0.75 * (1 - rp) } : { s: 0.5, o: 0 };
  return { x, y, o, press, ripple };
}

  if (!st || st.o <= 0.002) { op(el, 0); op(rip, 0); return; }
  op(el, st.o);
  tf(el, 'translate(' + px(st.x) + ',' + px(st.y) + ') scale(' + r2(st.press) + ')');
  op(rip, st.ripple.o); tf(rip, 'scale(' + r2(st.ripple.s) + ')');

/* ---------------------------------------------------------------- subtitles */
function renderSubs(t) {
  let best = null, a = 0;
  for (const c of CUES) {
    const w = win(t, c.start - 0.08, c.start + 0.1, c.end - 0.06, c.end + 0.1, E.outQuad, E.inQuad);
    if (w > a) { a = w; best = c; }
  }
  // bridge short gaps so the box does not flicker between phrases of one sentence
  if (!best) {
    let prev = null, next = null;
    for (const c of CUES) { if (c.end <= t) prev = c; if (!next && c.start > t) next = c; }
    if (prev && next && next.start - prev.end < 0.65 && t - prev.end < 0.65) { best = prev; a = 0; }
  }
  const show = typeof window === 'undefined' || window.ACD_SUBS !== false;
  op($['subsBox'], show ? a : 0);
  if (best) txt($['subsBox'], best.sub);
  let sh = 0;
  for (const c of CUES) sh = Math.max(sh, win(t, c.start - 0.4, c.start, c.end, c.end + 0.5, E.inOutSine, E.inOutSine));
  op($['subShade'], show ? 0.9 * sh : 0);
}

/* ==========================================================================

let lastFrame = -1;
function renderTime(t) {
  t = clamp(t, 0, DURATION - 1 / FPS);

}

        case 'blip': glide(t, ev.f || 1800, (ev.f || 1800) * 1.15, 0.05, 0.08 * soft, ((idx % 2) ? 0.3 : -0.3), 0.15); break;
        case 'paste': glide(t, 300, 180, 0.12, 0.18, 0, 0.1); glide(t + 0.04, 900, 1400, 0.08, 0.1, 0.2, 0.2); break;
        case 'sting': glide(t, 74, 37, 2.4, 0.45, 0, 0.35); [62, 69, 74, 78, 81].forEach((m, i) => bell(t + i * 0.035, m, 0.075, 3.8, -0.4 + i * 0.2, 0.75)); break;
      }
    });
    onProgress && onProgress(0.7);

    /* ---- 6. reverb (Freeverb-style, 24 kHz) on the send bus */
    {
      const RSR = 24000, RN = Math.ceil(N / 2), inp = new Float32Array(RN);
      for (let i = 0; i < RN; i++) inp[i] = (SEND[2 * i] + (SEND[2 * i + 1] || 0)) * 0.5;
      const combT = [1116, 1188, 1277, 1356, 1422, 1491, 1557, 1617].map(v => Math.round(v * RSR / 44100));
      const apT = [556, 441, 341, 225].map(v => Math.round(v * RSR / 44100));
      const outL = new Float32Array(RN), outR = new Float32Array(RN);
      for (const [out, spread] of [[outL, 0], [outR, 12]]) {
        const combs = combT.map(d => ({ b: new Float32Array(d + spread), i: 0, z: 0 }));
        const aps = apT.map(d => ({ b: new Float32Array(d + spread), i: 0 }));
        const fb = 0.86, damp = 0.32;
        for (let n = 0; n < RN; n++) {
          const x = inp[n] * 0.015; let y = 0;
          for (const c of combs) { const o = c.b[c.i]; c.z = o * (1 - damp) + c.z * damp; c.b[c.i] = x + c.z * fb; c.i = (c.i + 1) % c.b.length; y += o; }
          for (const a of aps) { const o = a.b[a.i]; const v = -y + o; a.b[a.i] = y + o * 0.5; a.i = (a.i + 1) % a.b.length; y = v; }
          out[n] = y;
        }
      }
      for (let i = 0; i < N; i++) { const x = i / 2, j = x | 0, f = x - j, j1 = Math.min(RN - 1, j + 1); L[i] += (outL[j] + (outL[j1] - outL[j]) * f) * 3.2; R[i] += (outR[j] + (outR[j1] - outR[j]) * f) * 3.2; }
    }
    onProgress && onProgress(0.9);

    /* ---- 7. master: RMS-normalise, soft-limit, fades */
    let acc = 0; for (let i = 0; i < N; i += 4) acc += L[i] * L[i] + R[i] * R[i];
    const rms = Math.sqrt(acc / (N / 2));
    const g = 0.105 / (rms || 1);          // ≈ -19.6 dBFS RMS before limiting
    const knee = 0.56, room = 0.28;     // ceiling ≈ 0.84 (−1.5 dBFS) to leave AAC headroom
    for (let i = 0; i < N; i++) {
      const t = i / SR, fade = Math.min(1, t / 0.05) * Math.min(1, Math.max(0, (DURATION - t) / 0.7));
      for (const buf of [L, R]) {
        let x = buf[i] * g, ax = Math.abs(x);
        if (ax > knee) x = Math.sign(x) * (knee + room * Math.tanh((ax - knee) / room));
        buf[i] = x * fade;
      }
    }
    onProgress && onProgress(1);
    return { L, R, sampleRate: SR, length: N };
  }

  /* async wrapper so the page stays responsive while the mix is computed */
  let cache = null;
  async function render(onProgress) {
    if (cache) return cache;
    await new Promise(r => setTimeout(r, 0));
    cache = synth(buildSoundEvents(), onProgress);
    return cache;
  }
  /* interleaved 16-bit PCM, base64-encoded in chunks (used by render-video.js) */
  async function pcm16Chunks(chunkFrames) {
    const mix = await render();
    chunkFrames = chunkFrames || 480000;
    const out = [];
    for (let s = 0; s < mix.length; s += chunkFrames) {
      const n = Math.min(chunkFrames, mix.length - s), buf = new Int16Array(n * 2);
      for (let i = 0; i < n; i++) {
        buf[2 * i] = Math.max(-32768, Math.min(32767, Math.round(mix.L[s + i] * 32767)));
        buf[2 * i + 1] = Math.max(-32768, Math.min(32767, Math.round(mix.R[s + i] * 32767)));
      }
      const bytes = new Uint8Array(buf.buffer); let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      out.push(btoa(bin));
    }
    return out;
  }
  return { SR, N, render, pcm16Chunks, CHORDS };
})();

/* ---- player.js ---- */
/* ==========================================================================
 * player.js — preview player. Playback is quantised to frames: the frame
 * shown while playing is exactly renderFrame(floor(t * 60)), the same call a
 * seek or the MP4 exporter makes. Audio is the precomputed mix from
 * audio.js, started at offset t, so seek/restart always re-sync sound cues.
 * ========================================================================== */
(function () {
  const params = new URLSearchParams(location.search);
  const RENDER = params.get('render') === '1';
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  if (RENDER) document.body.classList.add('render');

  initStage(stage);
  window.renderFrame = renderFrame;

  async function waitAssets() {
    await Promise.all(['400', '500', '600', '700', '800'].map(w => document.fonts.load(w + ' 24px Inter')));
    await Promise.all(['400', '500', '600', '700', '800'].map(w => document.fonts.load(w + ' 24px "Plus Jakarta Sans"')));
    await Promise.all(['400', '600', '700'].map(w => document.fonts.load(w + ' 24px "JetBrains Mono"')));
    await document.fonts.ready;
    await Promise.all(Array.from(stage.querySelectorAll('img')).map(im => (im.decode ? im.decode().catch(() => {}) : null)));
  }
  const ready = (async () => {
    await waitAssets();
    initMeasure();
    renderFrame(0);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    return true;
  })();
  window.ACD = { ready, FPS, DURATION, TOTAL_FRAMES, TOTALS, CUES, NARRATION, renderFrame, audio: AUDIO, soundEvents: () => buildSoundEvents() };

  function fit() {
    const w = viewport.clientWidth, h = viewport.clientHeight, s = Math.min(w / 1920, h / 1080);
    stage.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }
  fit(); window.addEventListener('resize', fit);
  if (RENDER) return; // export mode: no UI, no audio playback, the exporter drives renderFrame()

  /* ------------------------------------------------------------ state */
  const P = { playing: false, t: 0, startT: 0, startPerf: 0, ctx: null, gain: null, src: null, buffer: null, mix: null,
    audioT0: 0, ctxT0: 0, audioClock: false, muted: params.get('mute') === '1', lastFrame: -1 };
  window.ACD_SUBS = params.get('subs') !== '0';
  // read-only state for tools/check-player.js
  window.ACD.player = { get state() { return { playing: P.playing, t: P.playing ? now() : P.t, frame: P.lastFrame, muted: P.muted, gain: P.gain ? P.gain.gain.value : null, ctx: P.ctx ? P.ctx.state : null, audioClock: P.audioClock, buffer: !!P.buffer, clean: document.body.classList.contains('clean'), subs: window.ACD_SUBS }; } };
  const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0'); };

  /* ------------------------------------------------------------ UI */
  const startOv = document.getElementById('startOverlay');
  const ctl = document.getElementById('controls');
  ctl.innerHTML =
    '<div class="ctl-row">' +
      '<button class="ctl-btn primary" id="bPlay" aria-label="Main">▶ Main</button>' +
      '<button class="ctl-btn" id="bRestart" aria-label="Mula semula">⟲ Mula Semula</button>' +
      '<span class="ctl-time" id="tTime">00:00.00 / ' + fmt(DURATION) + '</span>' +
      '<div class="ctl-scrub-wrap"><input id="scrub" type="range" min="0" max="' + (TOTAL_FRAMES - 1) + '" step="1" value="0" aria-label="Garis masa"><div class="scene-marks" id="marks"></div></div>' +
      '<button class="ctl-btn" id="bMute" aria-label="Bunyi">🔊 Bunyi: Hidup</button>' +
      '<button class="ctl-btn" id="bSubs" aria-label="Sari kata">Sari Kata: Hidup</button>' +
      '<button class="ctl-btn" id="bSpeech" aria-label="Suara Bahasa Melayu pelayar" disabled>Suara BM (ms-MY)</button>' +
      '<button class="ctl-btn" id="bFull" aria-label="Skrin penuh">⛶ Skrin Penuh</button>' +
      '<button class="ctl-btn" id="bClean" aria-label="Mod rakaman bersih">● Mod Rakaman Bersih</button>' +
    '</div>' +
    '<div class="scene-btns" id="scenes">' + SCENES.map(s => '<button class="scene-btn" data-s="' + s.id + '">' + s.id + ' · ' + s.key + '</button>').join('') +
      '<span class="ctl-hint">Ruang: main/jeda · R: mula semula · ←/→: ±1 s · , / .: satu bingkai · 1–' + SCENES.length + ': babak · F: skrin penuh · M: bunyi · S: sari kata · C: mod bersih (Esc keluar)</span></div>';
  const $b = id => document.getElementById(id);
  $b('marks').innerHTML = SCENES.slice(1).map(s => '<i style="left:' + (s.start / DURATION * 100) + '%"></i>').join('');
  const startStatus = document.getElementById('startStatus');
  const SP = { enabled: false, voice: null, last: -1 };
  let scrubbing = false, scrubWas = false;

  function updateUI(t) {
    $b('tTime').textContent = fmt(t) + ' / ' + fmt(DURATION) + '  ·  f' + Math.floor(t * FPS + 1e-6);
    if (!scrubbing) $b('scrub').value = String(Math.floor(t * FPS + 1e-6));
    $b('bPlay').textContent = P.playing ? '❚❚ Jeda' : '▶ Main';
    $b('bPlay').setAttribute('aria-label', P.playing ? 'Jeda' : 'Main');
    const sc = SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.toggle('on', +b.dataset.s === sc.id));
    $b('bMute').textContent = P.muted ? '🔇 Bunyi: Mati' : '🔊 Bunyi: Hidup';
    $b('bSubs').textContent = 'Sari Kata: ' + (window.ACD_SUBS ? 'Hidup' : 'Mati');
    $b('bSpeech').classList.toggle('on', SP.enabled);
    $b('bClean').classList.toggle('on', document.body.classList.contains('clean'));
  }
  function renderAt(t, force) {
    const f = Math.min(TOTAL_FRAMES - 1, Math.floor(t * FPS + 1e-6));
    if (f !== P.lastFrame || force) { renderFrame(f); P.lastFrame = f; }
    updateUI(f / FPS);
  }

  /* ------------------------------------------------------------ audio */
  async function unlockAudio() {
    if (P.ctx) { if (P.ctx.state === 'suspended') await P.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { P.ctx = new AC({ sampleRate: 48000 }); } catch (e) { P.ctx = new AC(); }
    P.gain = P.ctx.createGain(); P.gain.gain.value = P.muted ? 0 : 1; P.gain.connect(P.ctx.destination);
    if (P.ctx.state === 'suspended') await P.ctx.resume().catch(() => {});
    attachBuffer();
  }
  function attachBuffer() {
    if (!P.ctx || !P.mix || P.buffer) return;
    const b = P.ctx.createBuffer(2, P.mix.length, P.mix.sampleRate);
    b.copyToChannel(P.mix.L, 0); b.copyToChannel(P.mix.R, 1);
    P.buffer = b;
    if (P.playing) { P.t = now(); P.startT = P.t; P.startPerf = performance.now(); startAudio(P.t); }
  }
  function startAudio(t) {
    stopAudio();
    if (!P.ctx || !P.buffer) { P.audioClock = false; return; }
    const src = P.ctx.createBufferSource(); src.buffer = P.buffer; src.connect(P.gain);
    const when = P.ctx.currentTime + 0.03;
    src.start(when, Math.max(0, t));
    P.src = src; P.ctxT0 = when; P.audioT0 = t; P.audioClock = true;
  }
  function stopAudio() { if (P.src) { try { P.src.stop(); } catch (e) {} P.src.disconnect(); P.src = null; } P.audioClock = false; }
  function now() {
    if (!P.playing) return P.t;
    if (P.audioClock && P.ctx) return P.audioT0 + Math.max(0, P.ctx.currentTime - P.ctxT0);
    return P.startT + (performance.now() - P.startPerf) / 1000;
  }
  // compute the mix in the background so the first click is instant
  AUDIO.render(p => { if (startStatus) startStatus.textContent = 'Menyediakan audio… ' + Math.round(p * 100) + '%'; })
    .then(mix => { P.mix = mix; if (startStatus) startStatus.textContent = 'Sedia · luar talian'; attachBuffer(); });

  /* ------------------------------------------------------------ Web Speech (optional ms-MY preview) */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    SP.voice = vs.find(v => /^ms([-_]|$)/i.test(v.lang)) || null;
    const b = $b('bSpeech');
    b.disabled = !SP.voice;
    b.title = SP.voice ? 'Pratonton naratif dengan suara pelayar: ' + SP.voice.name : 'Tiada suara Bahasa Melayu (ms-MY) dalam pelayar ini';
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  else $b('bSpeech').title = 'Pelayar ini tidak menyokong Web Speech';
  function speechCancel() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speechFrom(t) { SP.last = -1; CUES.forEach((n, i) => { if (n.start < t - 0.05) SP.last = i; }); }
  function speechTick(t) {
    if (!SP.enabled || !SP.voice || !P.playing) return;
    for (let i = SP.last + 1; i < CUES.length; i++) {
      const n = CUES[i];
      if (t >= n.start && t < n.end) {
        SP.last = i;
        const u = new SpeechSynthesisUtterance(n.say); u.voice = SP.voice; u.lang = SP.voice.lang; u.rate = 1.05;
        speechSynthesis.speak(u);
      } else break;
    }
  }

  /* ------------------------------------------------------------ transport */
  let raf = 0;
  function loop() {
    raf = 0;
    if (!P.playing) return;
    const t = now();
    if (t >= DURATION - 1 / FPS) { P.playing = false; P.t = DURATION - 1 / FPS; stopAudio(); renderAt(P.t, true); showControls(); return; }
    renderAt(t);
    speechTick(t);
    raf = requestAnimationFrame(loop);
  }
  function play() {
    if (P.playing) return;
    if (P.t >= DURATION - 1 / FPS - 1e-6) P.t = 0;
    P.playing = true; P.startT = P.t; P.startPerf = performance.now();
    startAudio(P.t); speechFrom(P.t);
    if (!raf) raf = requestAnimationFrame(loop);
    scheduleHide();
  }
  function pause() {
    if (!P.playing) return;
    P.t = Math.floor(now() * FPS) / FPS; P.playing = false;
    stopAudio(); speechCancel(); renderAt(P.t, true); showControls();
  }
  function seek(t) {
    const was = P.playing;
    if (was) { stopAudio(); speechCancel(); }
    P.t = clamp(Math.floor(t * FPS + 1e-6) / FPS, 0, DURATION - 1 / FPS);
    if (was) { P.startT = P.t; P.startPerf = performance.now(); startAudio(P.t); speechFrom(P.t); }
    renderAt(P.t, true);
  }
  function restart() { seek(0); if (!P.playing) play(); }
  async function gesture() { startOv.style.display = 'none'; await unlockAudio(); }

  /* ------------------------------------------------------------ controls wiring */
  $b('bPlay').addEventListener('click', async () => { await gesture(); P.playing ? pause() : play(); });
  $b('bRestart').addEventListener('click', async () => { await gesture(); restart(); });
  $b('bMute').addEventListener('click', async () => { await gesture(); P.muted = !P.muted; if (P.gain) P.gain.gain.value = P.muted ? 0 : 1; updateUI(P.playing ? now() : P.t); });
  $b('bSubs').addEventListener('click', () => { window.ACD_SUBS = !window.ACD_SUBS; renderAt(P.playing ? now() : P.t, true); });
  $b('bSpeech').addEventListener('click', async () => { await gesture(); SP.enabled = !SP.enabled; speechCancel(); speechFrom(P.playing ? now() : P.t); updateUI(P.playing ? now() : P.t); });
  $b('bFull').addEventListener('click', toggleFull);
  $b('bClean').addEventListener('click', () => setClean(true));
  document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', async () => { await gesture(); seek(SCENES[+b.dataset.s - 1].start); }));
  const scrub = $b('scrub');
  scrub.addEventListener('pointerdown', () => { scrubbing = true; scrubWas = P.playing; if (P.playing) pause(); });
  scrub.addEventListener('input', () => { seek(+scrub.value / FPS); });
  const endScrub = async () => { if (!scrubbing) return; scrubbing = false; if (scrubWas) { await gesture(); play(); } };
  scrub.addEventListener('pointerup', endScrub); scrub.addEventListener('change', endScrub);
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen && document.exitFullscreen();
  }
  function setClean(on) { document.body.classList.toggle('clean', on); if (on) startOv.style.display = 'none'; updateUI(P.playing ? now() : P.t); }
  window.addEventListener('keydown', async e => {
    if (e.target && e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'Escape') { /* let the slider handle arrows */ }
    const k = e.key;
    if (k === ' ' || k === 'k') { e.preventDefault(); await gesture(); P.playing ? pause() : play(); }
    else if (k === 'r' || k === 'R') { await gesture(); restart(); }
    else if (k === 'ArrowRight') { e.preventDefault(); seek((P.playing ? now() : P.t) + (e.shiftKey ? 5 : 1)); }
    else if (k === 'ArrowLeft') { e.preventDefault(); seek((P.playing ? now() : P.t) - (e.shiftKey ? 5 : 1)); }
    else if (k === '.') { pause(); seek(P.t + 1 / FPS); }
    else if (k === ',') { pause(); seek(P.t - 1 / FPS); }
    else if (k >= '1' && k <= String(SCENES.length)) { await gesture(); seek(SCENES[+k - 1].start); }
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'm' || k === 'M') $b('bMute').click();
    else if (k === 's' || k === 'S') $b('bSubs').click();
    else if (k === 'c' || k === 'C') setClean(!document.body.classList.contains('clean'));
    else if (k === 'Escape') setClean(false);
    showControls();
  });
  // auto-hide while playing
  let hideTimer = 0;
  function showControls() { ctl.classList.remove('hidden'); document.body.style.cursor = ''; scheduleHide(); }
  function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (P.playing && !scrubbing) { ctl.classList.add('hidden'); document.body.style.cursor = 'none'; } }, 2500); }
  window.addEventListener('mousemove', showControls);
  window.addEventListener('pointerdown', e => { if (!ctl.contains(e.target) && e.target !== startOv && !startOv.contains(e.target)) showControls(); });

  // first user gesture unlocks audio
  const startClick = async () => { await gesture(); play(); };
  startOv.addEventListener('click', startClick);
  startOv.addEventListener('keydown', e => { if (e.key === 'Enter') startClick(); });

  if (params.get('clean') === '1') setClean(true);
  ready.then(() => {
    const t0 = parseFloat(params.get('t'));
    renderAt(isFinite(t0) ? clamp(t0, 0, DURATION - 1 / FPS) : 0, true);
    if (isFinite(t0)) P.t = clamp(Math.floor(t0 * FPS) / FPS, 0, DURATION - 1 / FPS);
  });
})();

</script>
</body>
